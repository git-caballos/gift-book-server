      }

      /** 副屏服务 */
      class GuestScreenService {
        constructor(app) {
          this.app = app;
          this.guestWindow = null;
          this.isConnected = false;
          this.heartbeatInterval = null;
          this.MESSAGE_TYPES = {
            INIT: "guest_screen_init",
            UPDATE: "guest_screen_update",
            HEARTBEAT: "guest_screen_heartbeat",
            CONFIG: "guest_screen_config",
          };

          window.addEventListener("message", (e) => this.handleMessage(e));
        }

        handleMessage(event) {
          // 仅接受同源窗口消息，避免其他页面注入数据
          if (event.origin !== window.location.origin) return;
          if (event.data?.type === "guest_screen_ready") {
            // 主页面刷新后 guestWindow 引用丢失：用消息来源重新绑定并立即推送数据
            if (event.source !== this.guestWindow) {
              this.guestWindow = event.source;
            }
            this.isConnected = true;
            this.syncToGuestScreen();
            this.startHeartbeat();
          }
        }

        open() {
          if (this.guestWindow && !this.guestWindow.closed) {
            this.guestWindow.focus();
            // 复用已打开的同名副屏窗口：直接主动推送数据并恢复心跳
            // （主页面刷新后 guestWindow 引用已丢失，无法依赖副屏重发 ready，必须主动同步）
            this.isConnected = true;
            this.syncToGuestScreen();
            this.startHeartbeat();
            return;
          }

          const screenWidth = window.screen.availWidth;
          const screenHeight = window.screen.availHeight;

          this.guestWindow = window.open("./guest-screen.html", "GuestScreen", `width=${screenWidth},height=${screenHeight},left=0,top=0,location=no,menubar=no,toolbar=no`);

          if (this.guestWindow) {
            // 同名窗口被复用时不会重新执行副屏 init、也不会再发 ready，
            // 主动推送一次当前数据确保副屏立即更新；首次打开时后续 ready 机制会再次同步兜底
            this.isConnected = true;
            this.syncToGuestScreen();
            this.startHeartbeat();
            setTimeout(() => {
              if (this.guestWindow?.document.documentElement.requestFullscreen) {
                this.guestWindow.document.documentElement.requestFullscreen().catch(() => console.log("无法自动全屏"));
              }
            }, 500);
          }
        }

        syncToGuestScreen() {
          if (!this.guestWindow || this.guestWindow.closed) {
            this.isConnected = false;
            this.stopHeartbeat();
            return;
          }

          const currentPageGifts = this.app.gifts.slice((this.app.currentPage - 1) * this.app.getItemsPerPage(), this.app.currentPage * this.app.getItemsPerPage());

          const activeGifts = currentPageGifts.filter((g) => g.data && !g.data.abolished);

          const message = {
            type: this.MESSAGE_TYPES.UPDATE,
            data: {
              eventName: this.app.currentEvent.name,
              theme: this.app.currentEvent.theme,
              currentPage: this.app.currentPage,
              gifts: activeGifts.map((g) => ({
                id: g.id,
                name: g.data.name,
                amount: g.data.amount,
                type: g.data.type,
                amountChinese: Utils.amountToChinese(g.data.amount),
              })),
              hidePrivacy: this.app.currentEvent.hidePrivacy || false,
              typeText: this.app.currentEvent.theme === "theme-solemn" ? "礼金" : "贺礼",
              itemsPerPage: this.app.getItemsPerPage(),
            },
            timestamp: Date.now(),
          };

          try {
            this.guestWindow.postMessage(message, "*");
          } catch (error) {
            console.error("发送消息到副屏失败:", error);
            this.isConnected = false;
          }
        }

        startHeartbeat() {
          this.stopHeartbeat();
          this.heartbeatInterval = setInterval(() => {
            if (!this.guestWindow || this.guestWindow.closed) {
              this.isConnected = false;
              this.stopHeartbeat();
              return;
            }

            try {
              this.guestWindow.postMessage(
                {
                  type: this.MESSAGE_TYPES.HEARTBEAT,
                  timestamp: Date.now(),
                },
                "*"
              );
            } catch (error) {
              this.isConnected = false;
              this.stopHeartbeat();
            }
          }, 30000);
        }

        stopHeartbeat() {
          if (this.heartbeatInterval) {
            clearInterval(this.heartbeatInterval);
            this.heartbeatInterval = null;
          }
        }

        close() {
          this.stopHeartbeat();
          if (this.guestWindow && !this.guestWindow.closed) {
            this.guestWindow.close();
          }
          this.guestWindow = null;
          this.isConnected = false;
        }
      }

      /**
       * GiftBookApp 应用核心
       * - 管理生命周期、事件绑定与数据流转
       */
      class GiftBookApp {
        constructor() {
          this.api = new ApiClient();
          this.giftRepository = new GiftRepository(this.api);
          this.session = new SessionManager();
          this.passwordCache = new PasswordCache(CONFIG.PASSWORD_CACHE_DURATION);
          this.ui = new UIManager();
          this.giftManager = new GiftManager(this);
          this.exportService = new ExportService(this);
          this.statsService = new StatsService(this);
          this.guestScreenService = new GuestScreenService(this);

          this.token = null;
          this.user = null;
          this.accountPasswordHash = null; // 账号密码的 SHA-256 哈希（用于账号密码校验）
          this.currentEvent = null;
          this.currentDataKey = null; // 数据加密密钥（DEK）：登录时由 KEK 解开并缓存在内存
          this.gifts = [];
          this.currentPage = 1;
          this.isSpeechEnabled = true;
          this.totalAmountCache = 0;
          this.totalGiversCache = 0;
          this.cachedStats = null;
          this.statsAreDirty = true;
          this.selectedRemarkPresets = new Set();
          this.pdfGenerator = null;
          this.isGeneratingPdf = false;
          this.allGiftsDecrypted = false;
          this.REMARK_LABELS = [
            { key: "custom", label: "备注" },
            { key: "gift", label: "礼品" },
            { key: "relation", label: "关系" },
            { key: "phone", label: "电话" },
            { key: "address", label: "住址" },
          ];

          this.api.onUnauthorized = () => this.forceLogout();
        }

        /**
         * 应用初始化入口
         * 绑定事件并尝试恢复上次会话
         */
        async init() {
          try {
            this.setupInitialUI();
            this.bindEvents();
            await this.tryRestoreSession();
          } catch (error) {
            console.error("应用初始化失败:", error);
            this.ui.showNotification("系统初始化失败，请刷新后重试。", "error");
          }
        }

        /** 设置初始 UI 状态，例如默认时间与语音列表 */
        setupInitialUI() {
          const { date, time } = Utils.getCurrentDateTime();
          this.ui.elements.startDateInput.value = date;
          this.ui.elements.startTimeInput.value = "00:00";
          this.ui.elements.endDateInput.value = date;
          this.ui.elements.endTimeInput.value = "23:59";
          this.populateVoiceList();
        }

        /** 尝试恢复会话：先校验令牌，再还原数据加密密钥（DEK）与上次打开的事项 */
        async tryRestoreSession() {
          const savedSession = this.session.load();

          if (savedSession?.token) {
            this.api.setToken(savedSession.token);
            this.token = savedSession.token;
            this.user = savedSession.user || null;
            this.accountPasswordHash = savedSession.accountPasswordHash || null;
            this.currentDataKey = null;

            // 还原数据加密密钥（DEK）：刷新后无需重新输入密码即可解密数据
            this._restoreSessionKey(savedSession);

            try {
              const me = await this.api.request("GET", "/api/auth/me");
              this.user = me;
              this.session.setAuth({ token: this.token, user: me, accountPasswordHash: this.accountPasswordHash });

              // 必须同时具备账号加密参数（kdf）与内存中的 DEK，否则强制重新登录
              if (!me.kdf || !this.currentDataKey) {
                this.session.destroy();
                this.api.clearToken();
                this.token = null;
                this.ui.showNotification(
                me.kdf ? "无法还原会话密钥，请重新登录。" : "该账号为旧版账号（未初始化加密参数），暂不支持自动升级，请重新注册新账号。",
                "error"
              );
                this.ui.showScreen("setup");
                await this.updateAuthUI();
                await this.loadAuthConfig();
                return;
              }

              await this.updateAuthUI();
              await this.loadEvents();

              // 尝试恢复上次打开的事项
              if (savedSession.event?.id) {
                const event = await this.giftRepository.fetchEvent(savedSession.event.id).catch(() => null);
                if (event) {
                  this.currentEvent = event;
                  await this.startSession();
                  return;
                }
              }
              this.ui.showScreen("setup");
              return;
            } catch (error) {
              console.error("会话校验失败:", error);
              this.session.destroy();
              this.api.clearToken();
              this.token = null;
            }
          }

          this.ui.showScreen("setup");
          await this.updateAuthUI();
          await this.loadAuthConfig();
        }

        /** 从会话存储还原 DEK（用账号密码哈希解密 encryptedDek） */
        _restoreSessionKey(savedSession) {
          if (!savedSession.encryptedDek || !savedSession.accountPasswordHash) return;
          try {
            const bytes = CryptoJS.AES.decrypt(savedSession.encryptedDek, savedSession.accountPasswordHash);
            const dek = bytes.toString(CryptoJS.enc.Utf8);
            if (dek) this.currentDataKey = dek;
          } catch (error) {
            console.error("会话密钥还原失败", error);
          }
        }

        /** 加载所有事项：有事项时显示"选择事项"按钮，无事项时隐藏 */
        async loadEvents() {
          if (!this.token) return;
          try {
            const events = await this.giftRepository.fetchAllEvents();
            this.eventsList = events;
            this.ui.elements.selectEventSection.classList.toggle("hidden", events.length === 0);
            document.getElementById("or-text")?.classList.toggle("hidden", events.length === 0);
          } catch (error) {
            console.error("加载事项失败:", error);
            this.ui.showNotification("加载事项失败，请检查网络或服务状态。", "error");
          }
        }

        /** 账号登录：密码 → PBKDF2 派生 KEK → 解开服务端返回的 DEK 密文，缓存 DEK 于内存 */
        async handleLogin() {
          const account = document.getElementById("auth-account")?.value.trim();
          const password = document.getElementById("auth-password")?.value;
          if (!account || !password) {
            this.ui.showNotification("请输入账号和密码。", "error");
            return;
          }

          try {
            const res = await this.api.request("POST", "/api/auth/login", { account, password });
            this.token = res.token;
            this.user = res.user;
            this.accountPasswordHash = CryptoService.hash(password);
            this.currentDataKey = null;

            // 账号必须有信封加密参数；用密码派生 KEK 解开 DEK，失败说明密码错误或数据损坏
            if (!res.kdf || !res.kdf.dekEncrypted) {
              // 清理已赋值的登录态字段，避免脏登录态残留
              this.token = null;
              this.user = null;
              this.accountPasswordHash = null;
              this.api.clearToken();
              this.session.destroy();
              this.ui.showNotification("该账号未初始化加密数据，请重新注册或通过 BIN 备份导入数据。", "error");
              return;
            }
            const kek = await CryptoService.deriveKek(password, res.kdf.salt, res.kdf.iterations);
            const dek = CryptoService.unwrapDek(res.kdf.dekEncrypted, kek);
            if (!dek) {
              // 清理已赋值的登录态字段，避免脏登录态残留
              this.token = null;
              this.user = null;
              this.accountPasswordHash = null;
              this.api.clearToken();
              this.session.destroy();
              this.ui.showNotification("密钥校验失败，请确认密码正确。", "error");
              return;
            }
            this.currentDataKey = dek;

            this.api.setToken(this.token);
            this.session.setAuth({ token: this.token, user: this.user, accountPasswordHash: this.accountPasswordHash });
            // 立即持久化登录状态，刷新后保持登录（未进入事项也可恢复）
            this.session.save(null, this.currentDataKey);
            if (document.getElementById("auth-password")) document.getElementById("auth-password").value = "";

            this.ui.showNotification("登录成功。", "success");
            await this.updateAuthUI();
            await this.loadEvents();
          } catch (error) {
            this.ui.showNotification(error.message || "登录失败，请重试。", "error");
          }
        }

        /** 注册新账号（成功后回到登录页，表单清空） */
        async handleRegister() {
          const account = document.getElementById("auth-account")?.value.trim();
          const nickname = document.getElementById("auth-nickname")?.value.trim();
          const password = document.getElementById("auth-password")?.value;
          const confirm = document.getElementById("auth-password-confirm")?.value;
          if (!account || !password || !confirm) {
            this.ui.showNotification("请输入账号、密码并确认密码。", "error");
            return;
          }
          if (password !== confirm) {
            this.ui.showNotification("两次输入的密码不一致。", "error");
            return;
          }

          try {
            // 注册时生成随机数据加密密钥（DEK），用密码派生的 KEK 包裹后随请求入库；
            // 服务端仅存 DEK 密文，首次登录时再解开（DEK 生成后本地不保留）
            const dek = CryptoService.generateDek();
            const kdfSalt = CryptoService.generateSalt();
            const kek = await CryptoService.deriveKek(password, kdfSalt, CryptoService.PBKDF2_ITERATIONS);
            const dekEncrypted = CryptoService.wrapDek(dek, kek);

            // username（显示名）留空时后端默认使用账号
            await this.api.request("POST", "/api/auth/register", {
              account,
              username: nickname || undefined,
              password,
              kdfSalt,
              kdfIterations: CryptoService.PBKDF2_ITERATIONS,
              dekEncrypted,
            });
            // 注册成功后回到登录模式；清空登录与注册草稿，保证表单为空
            // （不自动填充账号密码，避免密码残留在输入框中；再次打开注册页同样为空）
            this._loginDraft = undefined;
            this.switchAuthMode("login");
            this._registerDraft = undefined;
            this.ui.showNotification("注册成功，请登录。", "success");
          } catch (error) {
            this.ui.showNotification(error.message || "注册失败，请重试。", "error");
          }
        }

        /** 退出登录 */
        handleLogout() {
          this.guestScreenService.close(); // 停止副屏心跳并关闭副屏窗口
          this.session.destroy();
          this.session.setAuth(null);
          this.api.clearToken();
          this.passwordCache.clearAll(); // 清理本地密码缓存，避免共享电脑残留他人密码密文
          this.token = null;
          this.user = null;
          this.accountPasswordHash = null;
          this.currentDataKey = null; // 清空内存中的 DEK
          this.currentEvent = null;
          this.gifts = [];
          this.currentPage = 1;
          this.ui.showNotification("已退出登录。", "info");
          this.ui.showScreen("setup");
          this.updateAuthUI();
        }

        /** 令牌失效时强制回到登录状态 */
        forceLogout() {
          this.guestScreenService.close(); // 停止副屏心跳并关闭副屏窗口
          this.session.destroy();
          this.session.setAuth(null);
          this.api.clearToken();
          this.passwordCache.clearAll();
          this.token = null;
          this.user = null;
          this.accountPasswordHash = null;
          this.currentDataKey = null; // 清空内存中的 DEK
          this.currentEvent = null;
          this.gifts = [];
          this.ui.showScreen("setup");
          this.updateAuthUI();
        }

        /**
         * 登录/注册模式切换：
         * - 登录模式：显示登录按钮 + 密码输入框，隐藏注册按钮与确认密码输入框
         * - 注册模式：显示注册按钮 + 确认密码输入框，隐藏登录按钮
         */
        switchAuthMode(mode) {
          const isRegister = mode === "register";
          const get = (id) => document.getElementById(id)?.value || "";
          const set = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.value = value;
          };

          // 1. 保存当前模式的输入草稿（切换时保留，返回时恢复）
          if (this._authMode === "register") {
            this._registerDraft = {
              account: get("auth-account"),
              nickname: get("auth-nickname"),
              password: get("auth-password"),
              confirm: get("auth-password-confirm"),
            };
          } else if (this._authMode === "login") {
            this._loginDraft = {
              account: get("auth-account"),
              password: get("auth-password"),
            };
          }
          this._authMode = mode;

          // 2. 切换按钮与输入框的显示/隐藏
          document.getElementById("auth-login-btn")?.classList.toggle("hidden", isRegister);
          document.getElementById("auth-register-btn")?.classList.toggle("hidden", !isRegister);
          document.getElementById("auth-password-confirm")?.classList.toggle("hidden", !isRegister);
          document.getElementById("auth-nickname")?.classList.toggle("hidden", !isRegister);
          const toggle = document.getElementById("auth-mode-toggle");
          if (toggle) {
            if (isRegister) {
              toggle.classList.remove("hidden");
              toggle.innerHTML = '已有账号？点击<span id="auth-switch-to-login" class="text-blue-600 cursor-pointer select-none">「去登录」</span>';
              document.getElementById("auth-switch-to-login")?.addEventListener("click", () => this.switchAuthMode("login"));
            } else if (this._registrationEnabled) {
              toggle.classList.remove("hidden");
              toggle.innerHTML = '没有账号？点击<span id="auth-switch-to-register" class="text-blue-600 cursor-pointer select-none">「注册新账号」</span>创建账号后即可使用。';
              document.getElementById("auth-switch-to-register")?.addEventListener("click", () => this.switchAuthMode("register"));
            } else {
              toggle.classList.add("hidden");
            }
          }

          // 3. 恢复目标模式的草稿（无草稿则清空输入框：注册页始终为空、登录页保留之前输入）
          const draft = isRegister ? this._registerDraft : this._loginDraft;
          set("auth-account", draft?.account || "");
          set("auth-nickname", isRegister ? draft?.nickname || "" : "");
          set("auth-password", draft?.password || "");
          set("auth-password-confirm", isRegister ? draft?.confirm || "" : "");
        }

        /** 根据登录状态切换界面：登录/注册表单 与 事项管理区域 */
        updateAuthUI() {
          const loggedIn = !!this.token;
          const authSection = document.getElementById("auth-section");
          if (authSection) authSection.classList.remove("hidden");
          document.getElementById("auth-login-panel")?.classList.toggle("hidden", loggedIn);

        /** 修改密码（信封加密：仅重新包裹数据密钥，O(1)，无需重加密任何礼金） */
        handleChangePassword() {
          const app = this;
          const content = `
            <div class="flex flex-col gap-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">旧密码</label>
                <input type="password" id="chpwd-old" class="w-full p-2 border rounded-lg focus:ring-2 themed-ring" autocomplete="current-password" placeholder="请输入当前密码">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                <input type="password" id="chpwd-new" class="w-full p-2 border rounded-lg focus:ring-2 themed-ring" autocomplete="new-password" placeholder="至少 6 位">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
                <input type="password" id="chpwd-confirm" class="w-full p-2 border rounded-lg focus:ring-2 themed-ring" autocomplete="new-password" placeholder="再次输入新密码">
              </div>
            </div>
          `;
          this.ui.showModal("修改密码", content, [
            {
              text: "取消",
              class: "themed-button-secondary border px-4 py-2 rounded",
              handler: () => {},
            },
            {
              text: "确认修改",
              class: "themed-button-primary px-4 py-2 rounded",
              keepOpen: true,
              handler: () => {
                const oldPwd = document.getElementById("chpwd-old")?.value || "";
                const newPwd = document.getElementById("chpwd-new")?.value || "";
                const confirmPwd = document.getElementById("chpwd-confirm")?.value || "";
                if (!oldPwd || !newPwd || !confirmPwd) {
                  app.ui.showNotification("请完整填写旧密码、新密码和确认密码。", "error");
                  return;
                }
                if (newPwd !== confirmPwd) {
                  app.ui.showNotification("两次输入的新密码不一致。", "error");
                  return;
                }
                app._performPasswordChange(oldPwd, newPwd);
              },
            },
          ]);
          setTimeout(() => document.getElementById("chpwd-old")?.focus(), 50);
        }

        /**
         * 执行密码修改（O(1)）：数据密钥（DEK）保持不变，仅用新密码派生的 KEK 重新包裹 DEK 提交服务端。
         * 完全无需遍历/重写任何礼金记录；任一步失败整体保持原状，旧密码仍有效，可安全重试
         */
        async _performPasswordChange(oldPwd, newPwd) {
          // 防重复提交：处理期间禁止再次触发（否则第二个请求用旧密码必然失败，误导用户）
          if (this.isChangingPassword) return;
          this.isChangingPassword = true;
          this.ui.showNotification("正在修改密码…", "info");
          try {
            if (!this.currentDataKey) {
              throw new Error("无法获取数据加密密钥，请重新登录。");
            }

            // 新密码 → PBKDF2 派生新 KEK → 重新包裹 DEK（仅一个密钥块，与礼金数量无关）
            const kdfSalt = CryptoService.generateSalt();
            const kek = await CryptoService.deriveKek(newPwd, kdfSalt, CryptoService.PBKDF2_ITERATIONS);
            const dekEncrypted = CryptoService.wrapDek(this.currentDataKey, kek);

            await this.api.request("PUT", "/api/auth/password", {
              oldPassword: oldPwd,
              newPassword: newPwd,
              kdfSalt,
              kdfIterations: CryptoService.PBKDF2_ITERATIONS,
              dekEncrypted,
            });

            // 更新本地密钥状态：DEK 不变，仅账号密码哈希变化（用于会话还原与密码校验）
            this.accountPasswordHash = CryptoService.hash(newPwd);
            // 清理旧密码的免密缓存（其包裹密钥为旧密码哈希，已失效）
            this.passwordCache.clearAll();
            try {
              this.session.setAuth({ token: this.token, user: this.user, accountPasswordHash: this.accountPasswordHash });
              this.session.save(this.currentEvent, this.currentDataKey);
            } catch (e) {
              console.error("会话保存失败:", e);
              // 服务端已改密成功，仅提示本地会话保存异常，不误报"修改失败"
              this.ui.showNotification("密码修改成功，但本地会话保存失败，请重新登录以确保安全。", "info");
            }

            // DEK 未变：内存中的礼金密文依然有效，无需重加密/重载
            this.ui.closeModal();
            this.toggleAvatarMenu(false);
            this.ui.showNotification("密码修改成功，数据密钥已更新。", "success");
          } catch (error) {
            this.ui.showNotification(error.message || "密码修改失败，请重试。", "error");
          } finally {
            this.isChangingPassword = false;
          }
        }

        /** 获取后端注册开关配置，开启注册时才显示"注册新账号"入口 */
        async loadAuthConfig() {
          try {
            const cfg = await this.api.request("GET", "/api/auth/config");
            this._registrationEnabled = cfg.registrationEnabled;
            const toggle = document.getElementById("auth-mode-toggle");
            if (!toggle) return;
            if (cfg.registrationEnabled) {
              toggle.classList.remove("hidden");
              toggle.innerHTML = '没有账号？点击<span id="auth-switch-to-register" class="text-blue-600 cursor-pointer select-none">「注册新账号」</span>创建账号后即可使用。';
              document.getElementById("auth-switch-to-register")?.addEventListener("click", () => this.switchAuthMode("register"));
            } else {
              toggle.classList.add("hidden");
            }
          } catch (error) {
            console.error("获取注册配置失败:", error);
          }
        }

        /** 启动事项会话，应用主题、加载礼金数据并展示主界面 */
        async startSession() {
          this.ui.elements.currentEventTitleEl.textContent = this.currentEvent.name;
          this.ui.applyTheme(this.currentEvent.theme);

          await this.applyCustomGiftBookStyle();

          this.currentEvent.printOptions = {
            ...DEFAULT_PRINT_OPTIONS,
            ...(this.currentEvent.printOptions || {}),
          };

          try {
            this.session.save(this.currentEvent, this.currentDataKey);
          } catch (error) {
            console.error("会话存储失败", error);
          }

          // 检查事项是否结束，提醒用户导出数据
          const endTime = new Date(this.currentEvent.endDateTime);
          const now = new Date();

          if (now > endTime && !this.currentEvent.exportReminded) {
            const title = "当前事项已结束";
            const message = `为方便长期留存与查阅，推荐通过【<strong>导出为 Excel</strong>】或【<strong>打印/另存为 PDF</strong>】功能，将礼金数据完整保存至电脑或微信，方便离线查阅。<br>
                             <span class="text-sm text-gray-600">云端数据为原始记录，导出为本地备份后，请与云端相互核对，确保版本一致。</span>`;

            setTimeout(() => {
              this.ui.showModal(title, message, [{
                text: "我已知晓",
                class: "themed-button-primary px-4 py-2 rounded",
                role: "secondary",
                handler: async () => {
                  try {
                    // 确认状态写入数据库，跨设备生效，下次进入不再提醒
                    await this.giftRepository.markExportReminded(this.currentEvent.id);
                    this.currentEvent.exportReminded = true;
                  } catch (error) {
                    console.error("标记提醒失败:", error);
                    // 静默失败：下次进入仍会提醒
                  }
                },
              }]);
            }, 500);
          }

          await this.giftManager.loadGiftsForCurrentEvent();
          // 校验当前数据密钥能解密已有数据，防止用错误/缺失密钥写入导致永久无法解密
          if (!this.verifyCurrentDataKey()) return;
          this.ui.showScreen("main");
        }

        /** 校验当前数据密钥能否解密已有数据，失败则强制重新登录 */
        verifyCurrentDataKey() {
          const dataKey = this.currentDataKey;
          if (!dataKey) {
            this.ui.showNotification("无法获取加解密密钥，请重新登录。", "error");
            this.forceLogout();
            return false;
          }
          const firstGift = this.gifts.find((g) => g.encryptedData);
          if (!firstGift) return true; // 无数据可验证，视为通过
          if (CryptoService.decryptData(firstGift.encryptedData, dataKey) === null) {
            this.ui.showNotification("当前密钥无法解密数据，可能已在其他设备修改过密码，请重新登录。", "error");
            this.forceLogout();
            return false;
          }
          return true;
        }

          document.getElementById("auth-password-confirm")?.addEventListener("keydown", (e) => {

          document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === "p") {
              e.preventDefault();
              this.exportService.prepareForPrint();
              return;
            }

            const isModalVisible = !this.ui.elements.modalContainer.classList.contains("hidden");
            const activeElement = document.activeElement;

            if (isModalVisible) {

              if (e.key === "Enter" && activeElement.tagName !== "TEXTAREA" && !activeElement.classList.contains("gridjs-input")) {
                e.preventDefault();
                // 始终触发 primary（确认）按钮，避免误触取消
                const primaryBtn = this.ui.elements.modalActions.querySelector('button[data-role="primary"]') || this.ui.elements.modalActions.querySelector("button:last-child");

              return;
            }

            // 在主界面且不在输入框中时，支持方向键翻页
            if (isMainScreenVisible && activeElement.tagName !== "INPUT" && activeElement.tagName !== "TEXTAREA") {
              if (e.key === "ArrowLeft") {
                e.preventDefault();
                // 左箭头 = 上一页
                if (!this.ui.elements.prevPageBtn.disabled) {
                  this.giftManager.changePage(-1);
                }
                return;
              }
              if (e.key === "ArrowRight") {
                e.preventDefault();
                // 右箭头 = 下一页
                if (!this.ui.elements.nextPageBtn.disabled) {
                  this.giftManager.changePage(1);
                }
                return;
              }
            }

            if (e.key === "Enter" && isMainScreenVisible && activeElement.tagName !== "TEXTAREA") {
              const guestName = this.ui.elements.guestNameInput.value.trim();
              const giftAmount = this.ui.elements.giftAmountInput.value.trim();

              if (guestName && giftAmount) {
                e.preventDefault();
                this.ui.elements.addGiftForm.querySelector('button[type="submit"]')?.click();
              }
            }
          });
        }

        handlePageInputChange(e) {
          const input = e.target;
          const newPage = parseInt(input.value, 10);
          const totalPages = Math.ceil(this.gifts.length / this.getItemsPerPage()) || 1;

          if (!isNaN(newPage) && newPage >= 1 && newPage <= totalPages && newPage !== this.currentPage) {
            this.currentPage = newPage;
            this.giftManager.ensureCurrentPageDecrypted();
            this.giftManager.render();
          } else {
            input.value = this.currentPage;
          }
        }

        /** 打开"选择事项"弹窗：展示全部事项，点击任意事项直接进入 */
        async openEventPicker() {
          try {
            let events = this.eventsList || [];
            if (events.length === 0) {
              events = await this.giftRepository.fetchAllEvents();
              this.eventsList = events;
            }
            if (events.length === 0) {
              this.ui.showNotification("暂无事项，请先创建新事项。", "info");
              return;
            }
            const renderEventItem = (e) => {
              const startInfo = Utils.getEventDateInfo(e.startDateTime);
              const endInfo = Utils.getEventDateInfo(e.endDateTime);
              // 时间范围文案：仅精确到日期，同日只显示一天，跨日显示完整起止
              let rangeText = "时间未设置";
              if (startInfo.formattedDisplay) {
                rangeText = endInfo.formattedDisplay && endInfo.formattedDisplay !== startInfo.formattedDisplay
                  ? `${startInfo.formattedDisplay} - ${endInfo.formattedDisplay}`
                  : startInfo.formattedDisplay;
              }

              // 进行状态徽标
              const startMs = startInfo.date.getTime();
              const endMs = endInfo.date.getTime();
              const now = Date.now();
              let badge = "";
              if (!Number.isNaN(startMs) && !Number.isNaN(endMs)) {
                if (now < startMs) badge = '<span class="flex-none text-[11px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">未开始</span>';
                else if (now > endMs) badge = '<span class="flex-none text-[11px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">已结束</span>';
                else badge = '<span class="flex-none text-[11px] px-2 py-0.5 rounded-full bg-green-50 text-green-600">进行中</span>';
              }

              return `
                <button type="button" data-event-id="${e.id}" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl border border-gray-100 bg-gray-50/70 hover:border-[var(--button-border-color)] hover:bg-white hover:shadow-sm transition group">
                  <span class="w-10 h-10 flex-none rounded-full bg-[var(--primary-bg-light)] text-[var(--button-text-color)] flex items-center justify-center font-bold text-lg">${Utils.escapeHtml((e.name || "?").charAt(0))}</span>
                  <span class="flex-1 min-w-0">
                    <span class="flex items-center gap-2">
                      <span class="font-medium text-gray-800 truncate">${Utils.escapeHtml(e.name)}</span>
                      ${badge}
                    </span>
                    <span class="flex items-center mt-1 text-xs text-gray-500">
                      <i class="ri-calendar-line mr-1 text-[var(--button-text-color)] leading-none"></i>
                      <span class="leading-none truncate">${rangeText}</span>
                    </span>
                  </span>
                  <span class="flex-none w-7 h-7 rounded-full bg-gray-100 group-hover:bg-[var(--primary-bg-light)] group-hover:text-[var(--button-text-color)] flex items-center justify-center">
                    <i class="ri-arrow-right-s-line text-lg text-gray-400 group-hover:text-[var(--button-text-color)] transition"></i>
                  </span>
                </button>
              `;
            };
            const itemsHtml = events.map(renderEventItem).join("");
            this.ui.showModal("选择事项", `
              <div class="px-1 pb-1">
                <div class="relative mb-3">
                  <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                  <input type="text" id="event-picker-search" placeholder="搜索事项名称…" class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:ring-2 themed-ring" />
                </div>
                <p id="event-picker-count" class="text-xs text-gray-400 mb-2">共 ${events.length} 个事项，点击进入</p>
                <div id="event-picker-list" class="space-y-2">${itemsHtml}</div>
                <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100">
                  <button type="button" id="btn-create-from-backup" class="flex-1 themed-button-primary px-4 py-2 rounded">从备份新建事项</button>
                  <button type="button" id="btn-event-picker-cancel" class="flex-1 themed-button-secondary border px-4 py-2 rounded">取消</button>
                </div>
              </div>
            `);
            this.ui.elements.modalActions.classList.add("hidden");
            this.ui.elements.modalContent.querySelectorAll("[data-event-id]").forEach((btn) => {
              btn.addEventListener("click", () => {
                this.ui.closeModal();
                this.handleUnlockEvent(parseInt(btn.dataset.eventId, 10));
              });
            });
            document.getElementById("btn-event-picker-cancel")?.addEventListener("click", () => this.ui.closeModal());
            document.getElementById("btn-create-from-backup")?.addEventListener("click", () => {
              this.ui.closeModal();
              this.openCreateFromBackupModal();
            });

            // 顶部搜索框：按事项名称实时过滤（重渲染后重新绑定点击）
            const listContainer = document.getElementById("event-picker-list");
            const countLabel = document.getElementById("event-picker-count");
            const bindItemClicks = (container) => {
              container.querySelectorAll("[data-event-id]").forEach((btn) => {
                btn.addEventListener("click", () => {
                  this.ui.closeModal();
                  this.handleUnlockEvent(parseInt(btn.dataset.eventId, 10));
                });
              });
            };
            document.getElementById("event-picker-search")?.addEventListener("input", (ev) => {
              const kw = ev.target.value.trim().toLowerCase();
              const filtered = kw ? events.filter((e) => (e.name || "").toLowerCase().includes(kw)) : events;
              if (listContainer) {
                listContainer.innerHTML = filtered.map(renderEventItem).join("");
                bindItemClicks(listContainer);
              }
              if (countLabel) {
                countLabel.textContent = filtered.length > 0
                  ? `${kw ? `“${ev.target.value.trim()}”` : ""}共 ${filtered.length} 个事项，点击进入`
                  : "未找到匹配的事项";
              }
            });
          } catch (error) {
            console.error("加载事项列表失败:", error);
            this.ui.showNotification("加载事项列表失败，请重试。", "error");
          }

        /** 根据事项 ID 进入会话（账号体系下无需再输入事项密码） */
        async handleUnlockEvent(eventId) {
          try {
            const event = await this.giftRepository.fetchEvent(eventId);
            if (!event) {
              this.ui.showNotification("未找到该事项。", "error");
              return;
            }
            this.currentEvent = event;
            await this.startSession();
          } catch (error) {

            this.ui.showNotification("进入事项失败，请重试。", "error");

        /** 返回创建/选择事项界面并清除当前事项会话（账号保持登录态） */
        showSetupScreen() {
          this.guestScreenService.close(); // 返回设置页时停止副屏心跳并关闭副屏窗口
          const previousEventId = this.currentEvent?.id;
          this.session.clear();
          this.currentEvent = null;
          this.gifts = [];
          if (previousEventId) {
            this.passwordCache.clear(previousEventId);
          }
          // 恢复创建表单的开始/结束默认时间
          this.setupInitialUI();
          this.ui.showScreen("setup");
          this.updateAuthUI();
          this.loadEvents();

        /** 创建新事项，包含表单校验与封面、打印配置处理 */
        async handleCreateEvent(e) {
          e.preventDefault();
          const name = this.ui.elements.eventNameInput.value.trim();
          const startDateTime = `${this.ui.elements.startDateInput.value}T${this.ui.elements.startTimeInput.value}`;
          const endDateTime = `${this.ui.elements.endDateInput.value}T${this.ui.elements.endTimeInput.value}`;
          const theme = this.ui.elements.eventThemeSelect.value;
          const voiceName = this.ui.elements.eventVoiceSelect.value;
          const recorder = document.getElementById("event-recorder").value.trim();
          const pdfEngine = "browser";

          if (!name || !startDateTime || !endDateTime) {
            this.ui.showNotification("请填写所有必填项。", "error");
            return;
          }

          if (new Date(startDateTime) >= new Date(endDateTime)) {
            this.ui.showNotification("开始时间必须早于结束时间。", "error");
            return;
          }

          const newEvent = {
            name,
            startDateTime,
            endDateTime,
            theme,
            voiceName,
            coverType: "default",
            recorder,
            minSpeechAmount: 0,
            printOptions: {
              ...DEFAULT_PRINT_OPTIONS,
              pdfEngine,
            },
          };

          try {
            const createdEvent = await this.giftRepository.createEvent(newEvent);
            this.currentEvent = createdEvent;
            this.ui.elements.createEventForm.reset();
            await this.startSession();
            this.ui.showNotification("事项创建成功。", "success");
          } catch (error) {
            this.ui.showNotification("创建事项失败，请重试。", "error");
          }
        }

        /**
         * 处理礼金录入表单提交
         * 验证输入并检查重复信息后给出确认提示
         */
        async handleAddGift(e) {
          e.preventDefault();
          const name = this.ui.elements.guestNameInput.value.trim();
          const amountStr = this.ui.elements.giftAmountInput.value;
          const type = document.querySelector('input[name="payment-type"]:checked')?.value;
          const remarkData = this.collectRemarkData();
          // 验证必填字段
          if (!name || !amountStr || !type) {
            this.ui.showNotification("信息不完整，请填写姓名、金额并选择收款类型。", "error");
            return;
          }

          // 验证金额有效性
          const amount = parseFloat(amountStr);
          if (isNaN(amount) || amount < 0) {
            this.ui.showNotification("金额无效，请输入非负金额。", "error");
            return;
          }

          if (type === "其他" && (!remarkData.custom || remarkData.custom.trim() === "")) {
            this.ui.showNotification("当收款类型为“其他”时，请在备注中说明具体情况。", "error");
            return; // 阻止提交
          }
          // 检查重复记录：同名或同名同金额（先确保全量解密，避免漏检；排除已作废记录，避免误报）
          this.giftManager.ensureAllGiftsDecrypted();
          const sameNameGifts = this.gifts.filter((g) => g.data && !g.data.abolished && g.data.name === name);
          const exactMatchExists = sameNameGifts.some((g) => g.data?.amount === amount);

          // 显示确认对话框（根据重复情况显示不同的警告级别）
          this.showGiftConfirmationModal(name, amount, remarkData, type, sameNameGifts.length > 0, exactMatchExists);
        }

        /** 打开副屏窗口 */
        openGuestScreen() {
          if (!this.currentEvent) {
            this.ui.showNotification("请先进入一个事项。", "error");
            return;
          }

          this.guestScreenService.open();
          this.ui.showNotification("副屏已打开，如未自动全屏请按 F11。", "info");
        }

        /**
         * 保存礼金记录
         * @param {Object} giftData - 礼金数据
         */
        async saveGift(giftData) {
          // 防重复提交：确认弹窗中快速双击“确认提交”或连按回车会并发触发两次，避免同一条记录被重复写入
          if (this.saveGiftInFlight) return;
          this.saveGiftInFlight = true;

          try {
            const isOutOfTime = new Date() < new Date(this.currentEvent.startDateTime) || new Date() > new Date(this.currentEvent.endDateTime);

            if (isOutOfTime) {
              const password = await this.requestAdminPassword("礼金补录", "当前已超出有效录入时间,请输入账号密码进行补录。", null, false);
              if (password === null) {
                this.ui.closeModal();
                return;
              }
            }
            // 默认等级为 0（普宾）
            const guestLevel = giftData.guestLevel !== undefined ? giftData.guestLevel : 0;

            // timestamp 放入 encryptedData，用于显示创建/修改时间
            const fullGiftData = {
              ...giftData,
              timestamp: new Date().toISOString(),
              guestLevel,
            };
            // 防御：会话密钥缺失时禁止写入，避免用空口令加密导致永久无法解密
            if (!this.currentDataKey) {
              this.ui.closeModal();
              this.ui.showNotification("登录状态异常，请重新登录后再录入。", "error");
              this.forceLogout();
              return;
            }
            const encryptedData = CryptoService.encryptData(fullGiftData, this.currentDataKey);

            // levelUpdateTime 默认为 0（未修改过等级）
            // 注意：createGift 返回服务端创建的完整礼金 DTO，需取其中的 id
            const createdGift = await this.giftRepository.createGift({
              eventId: this.currentEvent.id,
              encryptedData,
              guestLevelWeight: guestLevel,
              levelUpdateTime: 0, // 新增时为 0，表示未修改过等级
            });
            const newGiftId = createdGift?.id;

            // 服务端异常未返回 id 时，回退为整表重新加载，避免新记录不可见也无法定位/修改
            if (!newGiftId) {
              await this.giftManager.loadGiftsForCurrentEvent();
              this.ui.closeModal();
              this.giftManager.render();
              return;
            }

            // 优化：直接插入新记录到内存，避免重新查询
            const newGift = {
              id: newGiftId,
              eventId: this.currentEvent.id,
              encryptedData,
              guestLevelWeight: guestLevel,
              levelUpdateTime: 0,
              data: fullGiftData,
              _needsDecrypt: false,
            };

            this.gifts.push(newGift);
            this.giftManager.sortGiftsByLevel();

            // 更新缓存
            this.giftManager.updateCacheOnAdd(giftData.amount);

            // 跳转到新记录所在页
            const newIndex = this.gifts.findIndex((g) => g.id === newGiftId);
            if (newIndex !== -1) {
              this.currentPage = Math.floor(newIndex / this.getItemsPerPage()) + 1;
            }

            // 先解密目标页再渲染，避免跳页后未解密记录显示为空白单元格
            this.giftManager.ensureCurrentPageDecrypted();
            this.giftManager.render();

            this.ui.closeModal();
            this.ui.elements.addGiftForm.reset();
            document.querySelector('input[name="payment-type"][value="现金"]').checked = true;
            this.resetRemarkPresets();
            this.ui.elements.guestNameInput.focus();
            this.speakGift(giftData.name, giftData.amount);
            this.ui.showNotification("录入成功！", "success");
            this.guestScreenService.syncToGuestScreen();
          } catch (error) {
            this.ui.closeModal();
            console.error("录入失败:", error);
            this.ui.showNotification("录入失败，请重试。", "error");
          } finally {
            // 无论成功 / 失败 / 取消补录，都要释放锁，保证下次录入正常进行
            this.saveGiftInFlight = false;
          }
        }

        /**
         * 姓名搜索
         * 支持同名筛选与快捷跳转详情
         */
        handleSearch() {
          const searchTerm = this.ui.elements.searchNameInput.value.trim();
          if (!searchTerm) {
            this.ui.showNotification("请输入姓名进行搜索。");
            return;
          }

          const results = [];
          // 搜索需遍历全量数据：先同步解密所有记录，避免懒加载期间未解密记录被漏检
          this.giftManager.ensureAllGiftsDecrypted();
          for (let i = 0; i < this.gifts.length; i++) {
            // 确保解密后的 data 存在
            if (this.gifts[i].data?.name?.includes?.(searchTerm)) {
              results.push({ ...this.gifts[i], originalIndex: i });
            }
          }
          this.ui.elements.searchNameInput.blur();

          if (results.length === 0) {
            this.ui.showNotification(`没有找到姓名为 \"${searchTerm}\" 的记录`);
            return;
          }

          const resultsHtml = results
            .map((r) => {
              const giftData = r.data;
              const remarkText = this.formatRemarkDisplay(giftData.remarkData || null);

              // 只有当 remarkText 有内容时，才生成备注的HTML
              const remarkHtml = remarkText ? `<p class="text-sm text-red-500 mt-1"><strong>备注:</strong> ${Utils.escapeHtml(remarkText)}</p>` : "";

              return `
                        <div class="p-3 border-b flex justify-between items-center">
                          <div>
                            <p><strong>姓名:</strong> ${Utils.escapeHtml(giftData.name)}</p>
                            <p><strong>金额:</strong> ${giftData.amount.toFixed(2)} 元 (${giftData.type})</p>
                            ${remarkHtml}
                          </div>
                          <button class="view-details-btn themed-button-primary px-3 py-1 rounded" data-gift-index="${r.originalIndex}">查看详情</button>
                        </div>
                      `;
            })
            .join("");

          this.ui.showModal(`"${Utils.escapeHtml(searchTerm)}" 的搜索结果`, `<div class="max-h-80 overflow-y-auto">${resultsHtml}</div>`, [{ text: "关闭", class: "themed-button-secondary border px-4 py-2 rounded" }]);

          setTimeout(() => {
            document.querySelectorAll(".view-details-btn").forEach((btn) => {
              btn.onclick = () => {
                const giftIndex = parseInt(btn.dataset.giftIndex, 10);
                this.ui.closeModal();
                setTimeout(() => this.showGiftDetails(giftIndex), 150);
              };
            });
          }, 50);
        }

        /**
         * 展示礼金详情弹窗，并绑定详情区域操作按钮
         * @param {number} giftIndex - 当前礼金在 this.gifts 中的下标
         * @param {Object} options - 额外配置
         * @param {boolean} options.fromStats - 是否来自统计页（隐藏返回按钮）
         *
         * 核心职责：
         * - 渲染礼金基础信息、嘉宾等级、备注详情
         * - 控制纠错、修改金额、备注、撤销等入口
         * - 在存在历史记录时拼装时间线并支持快照查看
         */
        showGiftDetails(giftIndex, options = {}) {
          const { fromStats = false } = options;
          const gift = this.gifts[giftIndex];
          if (!gift || !gift.data) return;

          const g = gift.data;
          const hasHistory = g.history && g.history.length > 0;
          const isAbolished = g.abolished === true;
          const nameCorrectionCount = countNameCorrections(g.history);
          const remainingNameCorrections = Math.max(0, 2 - nameCorrectionCount);
          const canCorrectName = !isAbolished && remainingNameCorrections > 0;
          const amountCorrectionCount = countAmountCorrections(g.history);
          const remainingAmountCorrections = Math.max(0, 1 - amountCorrectionCount);
          const canModifyAmount = !isAbolished && remainingAmountCorrections > 0;

          // 生成嘉宾等级选项（使得嘉宾等级高的排在前面）
          const guestLevel = g.guestLevel !== undefined ? g.guestLevel : 0;
          const levelOptions = CONFIG.GUEST_LEVELS.map((levelName, index) => ({ levelName, index }))
            .reverse() // 反转数组，得等级高的排前面
            .map(({ levelName, index }) => `<option value="${index}" ${index === guestLevel ? "selected" : ""}>${levelName}</option>`)
            .join("");

          // 根据剩余纠错/修改次数控制按钮是否可用及提示文案
          const correctNameButtonHtml = !isAbolished
            ? `<button id="btn-correct-name" data-remaining-corrections="${remainingNameCorrections}" class="text-sm text-blue-600 hover:underline px-2 py-1 ${canCorrectName ? "" : "opacity-50 cursor-not-allowed"}" ${
                canCorrectName ? "" : 'disabled data-fixed-disabled="true" title="姓名纠错次数已达上限"'
              }>纠错</button>`
            : "";
          const modifyAmountButtonHtml = !isAbolished
            ? `<button id="btn-modify-amount" data-remaining-amount-corrections="${remainingAmountCorrections}" class="text-sm text-blue-600 hover:underline px-2 py-1 ${
                canModifyAmount ? "" : "opacity-50 cursor-not-allowed"
              }" ${canModifyAmount ? "" : 'disabled data-fixed-disabled="true" title="金额已修改，无法再次调整"'}>修改</button>`
            : "";
          const detailsHtml = `
                      <div class="space-y-4 text-left h-full flex flex-col" id="current-details-container" data-gift-index="${giftIndex}">
                        <div class="flex justify-between items-center border-b pb-2 mb-2">
                          <h4 class="font-bold text-lg">当前记录信息</h4>
                        </div>
                        ${
                          isAbolished
                            ? `
                          <div class="p-3 bg-red-50  border-red-500 text-red-800 rounded">
                            <p class="font-bold flex items-center"><i class="ri-error-warning-line mr-2"></i>此记录已作废。</p>
                            <p class="text-sm mt-1"><strong>作废理由：</strong>${Utils.escapeHtml(g.abolishReason || "无")}</p>
                            <p class="text-xs text-gray-600 mt-1">作废时间：${new Date(g.abolishTime).toLocaleString("zh-CN")}</p>
                          </div>
                        `
                            : ""
                        }

                        <div id="name-display-area" class="flex justify-between items-center p-2 hover:bg-gray-50 rounded ${isAbolished ? "opacity-60" : ""}">
                          <div class="flex items-center gap-3 flex-wrap">
                            <div><strong>姓名:</strong> <span class="text-lg ml-2">${Utils.escapeHtml(g.name)}</span></div>
                            ${
                              !isAbolished
                                ? `
                              <div class="flex items-center gap-2">
                                <select id="guest-level-select" class="text-sm px-3 py-1.5 border border-gray-300 rounded-md bg-white themed-ring cursor-pointer">
                                  ${levelOptions}
                                </select>
                              </div>
                            `
                                : ""
                            }
                          </div>
                          ${correctNameButtonHtml}
                        </div>

                        <div id="amount-display-area" class="flex justify-between items-center p-2 hover:bg-gray-50 rounded ${isAbolished ? "opacity-60" : ""}">
                          <div>
                            <p><strong>金额:</strong> <span class="font-bold themed-text text-lg ml-2 ${isAbolished ? "line-through" : ""}">${Utils.formatCurrency(g.amount)}</span></p>
                            <p class="text-sm text-gray-500 mt-1"><strong>类型:</strong> ${Utils.escapeHtml(g.type)}</p>
                          </div>
                          ${modifyAmountButtonHtml}
                        </div>

                        <div id="remarks-display-area" class="p-2 hover:bg-gray-50 rounded ${isAbolished ? "opacity-60" : ""}">
                          <div class="flex justify-between items-start">
                            <strong>备注:</strong>
                            ${!isAbolished ? '<button id="btn-edit-remarks" class="text-sm text-blue-600 hover:underline px-2 py-1">修改</button>' : ""}
                          </div>
                          <div class="mt-1 text-gray-700 space-y-1">
                            ${this.formatRemarkDetailsDisplay(g.remarkData)}
                          </div>
                        </div>

                        <div class="text-sm text-gray-400 border-t pt-2 mt-auto">
                          录入/修改时间: ${new Date(g.timestamp).toLocaleString("zh-CN")}
                        </div>
                      </div>`;

          let modalContent = "";
          if (hasHistory) {
            this.ui.elements.modal.classList.add("modal-large");
            const timelineHtml = this.statsService.generateTimelineHTML(g.history, g);
            modalContent = `
                        <div class="grid grid-cols-1 md:grid-cols-6 gap-6 h-[60vh]">
                          <div class="md:col-span-3 border-r pr-4 overflow-y-auto">${detailsHtml}</div>
                          <div class="md:col-span-3 pl-2 bg-gray-50 rounded-lg p-4">
                            <h4 class="font-bold text-lg border-b pb-2 mb-4 flex justify-between items-center">
                              <span>历史修改痕迹</span>
                            </h4>
                            ${timelineHtml}
                          </div>
                        </div>`;
          } else {
            this.ui.elements.modal.classList.remove("modal-large");
            modalContent = detailsHtml;
          }

          // 确保模态按钮可见
          this.ui.elements.modalActions.classList.remove("hidden");

          // 根据来源决定按钮文字和行为
          const modalButtons = fromStats
            ? [
                {
                  text: "返回统计",
                  class: "themed-button-secondary border px-4 py-2 rounded",
                  handler: () => this.statsService.showStatistics(),
                  keepOpen: true,
                },
              ]
            : [
                { text: '<i class="ri-delete-bin-line mr-1"></i>作废此记录', class: "themed-button-secondary border px-4 py-2 rounded mr-auto", handler: () => this.giftManager.abolishGift(giftIndex), keepOpen: true },
                { text: "关闭", class: "themed-button-secondary border px-4 py-2 rounded" },
              ];

          this.ui.showModal(`${Utils.escapeHtml(g.name)} 的礼金详情 ${hasHistory ? '<p class="text-sm text-orange-600 font-normal">（警告：此宾客数据存在修改，请自行验证数据真实性！）</p>' : ""}`, modalContent, modalButtons);

          // 绑定编辑和作废按钮事件
          setTimeout(() => {
            const btnCorrectName = document.getElementById("btn-correct-name");
            const btnModifyAmount = document.getElementById("btn-modify-amount");
            const btnEditRemarks = document.getElementById("btn-edit-remarks");
            const levelSelect = document.getElementById("guest-level-select");

            if (btnCorrectName && !btnCorrectName.disabled) btnCorrectName.onclick = () => this.enableInlineEdit(giftIndex, "name");
            if (btnModifyAmount && !btnModifyAmount.disabled) btnModifyAmount.onclick = () => this.enableInlineEdit(giftIndex, "amount");
            if (btnEditRemarks) btnEditRemarks.onclick = () => this.enableInlineEdit(giftIndex, "remarks");

            // 绑定宾客等级选择器变化事件
            if (levelSelect) {
              levelSelect.addEventListener("change", async (e) => {
                const newLevel = parseInt(e.target.value, 10);
                const oldLevel = g.guestLevel !== undefined ? g.guestLevel : 0;
                if (newLevel !== oldLevel) {
                  const oldLevelName = CONFIG.GUEST_LEVELS[oldLevel] || CONFIG.GUEST_LEVELS[0] || "";
                  const newLevelName = CONFIG.GUEST_LEVELS[newLevel] || CONFIG.GUEST_LEVELS[0] || "";

                  // 需要验证密码，但支持N分钟免密
                  const password = await this.requestAdminPassword("修改宾客等级", `即将把 "${g.name}" 从 "${oldLevelName}" 修改为 "${newLevelName}"`, null);

                  if (password === null) {
                    // 用户取消，恢复原来的值
                    e.target.value = oldLevel;
                    return;
                  }

                  // 更新宾客等级
                  await this.updateGuestLevel(giftIndex, newLevel, oldLevel);
                }
              });
            }

            if (hasHistory) {
              this.bindViewOriginalEvents(g.history, giftIndex);
            }
          }, 50);
        }

        /** 礼簿样式设置 */
        async showGiftBookStyleModal() {
          if (Utils.isMobile()) {
            this.ui.showNotification("移动端请使用默认样式", "info");
            return;
          }

          const isSolemn = this.currentEvent.theme === "theme-solemn";

          // 定义默认样式值
          const getDefaults = () => {
            return {
              name: { size: 20, color: "#333333", font: "" },
              type: { size: 20, color: isSolemn ? "#374151" : "#cc0000", font: "" },
              amountChinese: { size: 20, color: "#333333", font: "" },
              coverText: { size: 30, color: "#f5d4ab", font: "" },
              pageInfo: {
                themeColor: isSolemn ? "#374151" : "#ec403c",
                baseColor: isSolemn ? "#1f2937" : "#1f2937",
                font: "",
              },
            };
          };

          const style = this.currentEvent.customStyle || {};
          const localFonts = style.localFonts || [];
          const defaults = getDefaults();

          // 获取当前图片 URL
          const bgUrl = await ImageCache.getBackgroundUrl(this.currentEvent.id);
          let currentCoverUrl = "";
          if (this.currentEvent.coverType === "custom") {
            currentCoverUrl = await ImageCache.getEventCoverUrl(this.currentEvent.id);
          }

          const printOptions = {
            ...DEFAULT_PRINT_OPTIONS,
            ...(this.currentEvent.printOptions || {}),
          };

          // 4. 构建文字样式 HTML (使用配置数组)
          const fieldConfigs = [
            { key: "name", label: "礼簿页姓名", type: "std" },
            { key: "type", label: "礼簿页标签 (礼金/贺礼)", type: "std" },
            { key: "amountChinese", label: "礼簿页（大写金额）", type: "std" },
            { key: "coverText", label: "封面页标题", type: "std" },
            { key: "pageInfo", label: "基础样式", type: "print-special" }, // 特殊类型
          ];

          const textStyleHtml = fieldConfigs
            .map((config) => {
              const field = config.key;
              const custom = style[field] || {};
              const def = defaults[field];

              // 构建字体下拉框
              const displayFont = custom.font || "";
              const fontOptions = localFonts
                .map(
                  (f) =>
                    `<option value="${f.postscriptName}" style="font-family: '${f.family}', sans-serif;" ${f.postscriptName === displayFont ? "selected" : ""}>
                          ${f.fullName || f.family}
                      </option>`
                )
                .join("");
              const fontSelectHtml = `
                    <div class="flex items-center">
                      <label class="block font-medium text-gray-500 mr-1 whitespace-nowrap">字体</label>
                      <select data-field="${field}" data-prop="font"
                              class="flex-1 w-full p-2 border border-gray-300 rounded themed-ring text-sm bg-white text-gray-700"
                              ${localFonts.length === 0 ? "disabled" : ""}>
                        <option value="">系统默认字体</option>
                        ${fontOptions}
                      </select>
                    </div>`;

              // 根据类型生成不同的输入控件
              let inputsHtml = "";

              if (config.type === "print-special") {
                // pageInfo 特殊布局：主题色 + 基础字色 + 字体
                const displayThemeColor = custom.themeColor || def.themeColor;
                const displayBaseColor = custom.baseColor || def.baseColor;
                inputsHtml = `
                      <!-- 主题色 (边框/页头) -->
                      <div class="flex items-center">
                          <label class="block font-medium text-gray-500 mr-1 whitespace-nowrap">主题色</label>
                          <div class="flex flex-1 items-center w-full border border-gray-300 rounded overflow-hidden h-[38px] relative">
                              <input type="color" data-field="${field}" data-prop="themeColor" value="${displayThemeColor}"
                                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                              <div class="color-preview w-8 h-full border-r border-gray-200" style="background-color: ${displayThemeColor}"></div>
                              <span class="color-text flex-1 text-center text-sm text-gray-600 font-mono bg-white h-full leading-[38px]">
                                  ${displayThemeColor}
                              </span>
                          </div>
                      </div>
                      <!-- 基础字色 (页脚/内容) -->
                      <div class="flex items-center">
                          <label class="block font-medium text-gray-500 mr-1 whitespace-nowrap">基础字色</label>
                          <div class="flex flex-1 items-center w-full border border-gray-300 rounded overflow-hidden h-[38px] relative">
                              <input type="color" data-field="${field}" data-prop="baseColor" value="${displayBaseColor}"
                                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                              <div class="color-preview w-8 h-full border-r border-gray-200" style="background-color: ${displayBaseColor}"></div>
                              <span class="color-text flex-1 text-center text-sm text-gray-600 font-mono bg-white h-full leading-[38px]">
                                  ${displayBaseColor}
                              </span>
                          </div>
                      </div>
                      ${fontSelectHtml}
                   `;
              } else {
                // 标准布局：字号 + 颜色 + 字体
                const displaySize = custom.size || def.size;
                const displayColor = custom.color || def.color;

                inputsHtml = `
                      <!-- 字号 -->
                      <div class="flex items-center">
                          <label class="block font-medium text-gray-500 mr-1 whitespace-nowrap">字号 (px)</label>
                          <input type="number" data-field="${field}" data-prop="size" value="${displaySize}"
                              class="flex-1 w-full p-2 border border-gray-300 rounded themed-ring text-center font-bold text-gray-700 bg-gray-50 focus:bg-white">
                      </div>
                      <!-- 颜色 -->
                      <div class="flex items-center">
                          <label class="block font-medium text-gray-500 mr-1 whitespace-nowrap">颜色</label>
                          <div class="flex flex-1 items-center w-full border border-gray-300 rounded overflow-hidden h-[38px] relative">
                              <input type="color" data-field="${field}" data-prop="color" value="${displayColor}"
                                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                              <div class="color-preview w-8 h-full border-r border-gray-200" style="background-color: ${displayColor}"></div>
                              <span class="color-text flex-1 text-center text-sm text-gray-600 font-mono bg-white h-full leading-[38px]">
                                  ${displayColor}
                              </span>
                          </div>
                      </div>
                      ${fontSelectHtml}
                   `;
              }

              return `
                <div class="p-4 border rounded-lg bg-white shadow-sm flex flex-col h-full">
                  <h4 class="font-bold text-gray-800 mb-3 text-center pb-2 border-b border-gray-100 text-sm">${config.label}</h4>
                  <div class="space-y-3 flex-1">
                    ${inputsHtml}
                  </div>
                </div>`;
            })
            .join("");

          // HTML 构建
          // 统一 ID 命名规范： style-cover-* 和 style-bg-*
          const content = `
              <div class="space-y-6 text-left max-h-[75vh] pr-1">

                <!-- 第一部分：图片资源 (封面 & 背景) -->
                <div class="p-3 rounded border border-gray-200">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <!-- 封面图部分 -->
                      <div>
                          <div class="flex items-center justify-between mb-2">
                              <div class="flex items-center gap-3">
                                  <label class="block text-sm font-bold text-gray-700">礼簿封面图</label>
                                  <!-- 切换开关 -->
                                  <label class="relative h-5 w-16 cursor-pointer">
                                      <input type="checkbox" id="style-cover-toggle" class="sr-only peer" ${this.currentEvent.coverType === "custom" ? "checked" : ""}>
                                      <div class="h-full w-full rounded-full bg-gray-300 transition-colors duration-300 peer-checked:bg-[var(--button-bg-color)]"></div>
                                      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-bold transition-opacity duration-300 peer-checked:opacity-0">默认</span>
                                      <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] font-bold text-white opacity-0 transition-opacity duration-300 peer-checked:opacity-100">自定义</span>
                                      <div class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white shadow-md transition-transform duration-300 peer-checked:translate-x-[2.8rem]"></div>
                                  </label>
                              </div>
                          </div>
                          <div id="style-cover-section" class="mt-2 pl-1 ${this.currentEvent.coverType === "custom" ? "" : "hidden"}">
                              <!-- 预览区 -->
                              <div id="style-cover-preview-area" class="items-center gap-4 ${currentCoverUrl ? "flex" : "hidden"}">
                                <img id="style-cover-img" src="${currentCoverUrl || ""}" alt="封面预览" class="rounded border bg-white p-1 h-16 w-auto object-contain shadow-sm">
                                <button id="style-cover-remove-btn" class="text-sm text-red-600 hover:underline">删除封面图</button>
                              </div>
                              <!-- 上传区 -->
                              <div id="style-cover-upload-area" class="${currentCoverUrl ? "hidden" : "block"}">
                                <input type="file" id="style-cover-upload" accept="image/*" class="w-full mt-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300" />
                                 <p class="text-xs text-gray-500 mt-2 ml-1"> 建议尺寸 595 x 842px (A4纵向), 大小不超过2M。</p>
                              </div>
                          </div>
                      </div>

                      <!-- 背景图部分 -->
                      <div>
                          <label class="block text-sm font-bold text-gray-700 mb-2">礼簿页背景图</label>

                          <!-- 预览区 -->
                          <div id="style-bg-preview-area" class="${bgUrl ? "flex" : "hidden"} items-center gap-4 transition-all">

                            <button id="style-bg-remove-btn" class="text-sm text-red-600 hover:underline">删除背景图</button>
                          </div>

                          <!-- 上传区 -->
                          <div id="style-bg-upload-area" class="${bgUrl ? "hidden" : "block"} transition-all">
                             <input type="file" id="style-bg-upload" accept="image/*" class="w-full mt-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300" />
                             <p class="text-xs text-gray-500 mt-2 ml-1"> 建议浅色底纹。A4横版, 建议尺寸 842 x 595px。</p>
                          </div>
                      </div>
                  </div>
                </div>
                
                <!-- 第二部分：打印导出选项 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 保持原有打印选项逻辑不变 -->
                    <div class="flex gap-2 text-sm items-center flex-wrap">
                      <label class="block text-sm font-bold text-gray-700 ">礼簿附页选项：</label>
                        <label class="flex items-center"><input type="checkbox" id="style-print-cover" class="w-4 h-4 themed-ring rounded mr-1" ${printOptions.printCover ? "checked" : ""}><span>封面</span></label>

                        }><span>封面标题</span></label>
