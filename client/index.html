<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电子礼簿系统</title>
    <!-- 运行时配置（API 后端地址），须最先加载 -->
    <script src="./static/config.js"></script>
    <script src="./static/tailwindcss.js"></script>
    <script src="./static/xlsx.full.min.js"></script>
    <script src="./static/crypto-js.min.js"></script>
    <link href="./static/mermaid.min.css" rel="stylesheet" />
    <link href="./static/remixicon.css" rel="stylesheet" />
    <script src="./static/gridjs.umd.js"></script>
    <script src="./static/pdf-lib.min.js"></script>
    <script src="./static/fontkit.umd.min.js"></script>
    <script src="./static/GiftListPDFGenerator.js"></script>
    <link rel="preload" href="./static/bg.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="./static/cover1.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="./static/cover2.jpg" as="image" type="image/jpeg" />
    <style>
      /* 字体定义 */
      @font-face {
        font-family: "Source Han Serif CN Heavy";
        src: url("./static/SourceHanSerifCN-Heavy.ttf") format("truetype");
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      /* 主题变量 */
      :root,
      .theme-festive {
        --primary-color: #c00;
        --primary-color-hover: #a00;
        --primary-text-color: #c00;
        --primary-bg-light: #fff2f2;
        --primary-border-color: #ffaaaa;
        --primary-ring-color: #ef4444;
        --header-text-color: #b91c1c;
        --button-bg-color: #dc2626;
        --button-bg-hover: #b91c1c;
        --button-border-color: #dc2626;
        --button-text-color: #dc2626;
        --link-hover-bg: #fee2e2;
        --total-text-color: #ef4444;

        /* 默认自定义变量 */
        --name-font-size: var(--custom-name-size, 25px);
        --name-color: var(--custom-name-color, #333);
        --name-font-family: var(--custom-name-font, "KaiTi", "楷体", serif);
        --type-font-size: var(--custom-type-size, 22px);
        --type-color: var(--custom-type-color, #c00);
        --type-font-family: var(--custom-type-font, "Source Han Serif CN Heavy", serif);

        --amount-chinese-font-size: var(--custom-amount-chinese-size, 25px);
        --amount-chinese-color: var(--custom-amount-chinese-color, #333);
        --amount-chinese-font-family: var(--custom-amount-chinese-font, "KaiTi", "楷体", serif);

        --cover-text-font-size: var(--custom-cover-text-size, 30px);
        --cover-text-color: var(--custom-cover-text-color, #f5d4ab);
        --cover-text-font-family: var(--custom-cover-text-font, "KaiTi", "楷体", serif);

        --page-info-color: var(--custom-page-info-color, var(--primary-color));
        --page-info-font-family: var(--custom-page-info-font, inherit);
      }

      .theme-solemn {
        --primary-color: #374151;
        --primary-color-hover: #1f2937;
        --primary-text-color: #111827;
        --primary-bg-light: #f3f4f6;
        --primary-border-color: #d1d5db;
        --primary-ring-color: #4b5563;
        --header-text-color: #1f2937;
        --button-bg-color: #4b5563;
        --button-bg-hover: #374151;
        --button-border-color: #4b5563;
        --button-text-color: #4b5563;
        --link-hover-bg: #e5e7eb;
        --total-text-color: #374151;

        --type-color: var(--custom-type-color, #374151);
      }

      /* 基础样式 */
      body {
        font-family: "Inter", "Microsoft YaHei", sans-serif;
      }

      /* 礼簿样式 (屏幕显示) */
      .gift-book-frame {
        border: 4px solid var(--primary-color);
        padding: 22px;
        border-radius: 10px;
        background-color: var(--primary-bg-light);
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
        cursor: default;
        min-height: 450px;
      }

      #gift-book-content {
        display: grid;
        grid-template-rows: 3fr 1fr 3fr;
        border-top: 2px solid var(--primary-border-color);
        min-height: 0;
      }

      .print-book-content {
        display: flex;
        flex-direction: column;
        border-top: 2px solid var(--primary-border-color);
        flex: 1;
      }

      .print-book-content > .gift-book-row:first-child,
      .print-book-content > .gift-book-row:last-child {
        flex: 1;
        min-height: 0;
      }

      .gift-book-row {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(var(--gift-grid-columns, 12), minmax(0, 1fr));
      }
      .gift-book-row:nth-child(1),
      .gift-book-row:nth-child(3) {
        min-height: 33.3%;
      }

      .gift-book-row > .book-cell {
        min-width: 0;
        position: relative;
        line-height: 1.2;
      }

      .book-cell {
        border-right: 2px solid var(--primary-border-color);
        border-bottom: 2px solid var(--primary-border-color);
        display: grid;
        place-items: center;
        writing-mode: vertical-lr;
        text-orientation: mixed;
        font-weight: bold;
        font-size: clamp(16px, 1.6vw, 25px);
        letter-spacing: 7px;
        font-family: "KaiTi", "楷体", serif;
        padding: 10px 0;
        overflow: hidden;
        text-align: center;
      }

      .book-cell:first-child {
        border-left: 2px solid var(--primary-border-color);
      }

      .book-cell:hover {
        background-color: var(--link-hover-bg);
      }

      .name-cell .name {
        color: var(--name-color);
        padding: 15px 0;
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
        min-height: 8em;
        font-size: var(--name-font-size);
        font-family: var(--name-font-family);
      }

      .type-cell {
        color: var(--type-color);
        font-size: var(--type-font-size);
        padding: 10px 4px;
        font-family: var(--type-font-family);
        font-weight: bold;
      }

      .amount-cell {
        color: #333;
        cursor: pointer;
        grid-template-columns: 1fr auto;
        column-gap: clamp(8px, 1.5vw, 18px);
        justify-content: center;
      }

      .amount-chinese {
        letter-spacing: 1.5px;
        text-align: center;
        padding: 15px 0;
        flex: 1;
        overflow: hidden;
        font-size: var(--amount-chinese-font-size);
        color: var(--amount-chinese-color);
        font-family: var(--amount-chinese-font-family);
      }
      .amount-numeric {
        color: #555;
        letter-spacing: 1px;
        writing-mode: horizontal-tb;
        line-height: 3;
        font-size: clamp(10px, 1.3vw, 14px);
      }

      .mark {
        font-size: clamp(10px, 1.3vw, 14px);
        letter-spacing: 1px;
        color: var(--primary-color);
        white-space: nowrap;
        line-height: 1.2;
        height: 2.5em;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: absolute;
        bottom: 1vw;
        writing-mode: lr;
      }

      /* 主题组件 */
      .themed-edit-area {
        background-color: var(--primary-bg-light);
        border: 1px solid var(--primary-border-color);
        padding: 1rem;
        border-radius: 0.5rem;
        width: 100%;
      }

      input[type="checkbox"] {
        accent-color: var(--button-bg-color);
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      .themed-header {
        color: var(--header-text-color);
      }
      .themed-button-primary {
        background-color: var(--button-bg-color);
        color: white;
      }
      .themed-button-primary:hover {
        background-color: var(--button-bg-hover);
      }
      .themed-button-secondary {
        border-color: var(--button-border-color);
        color: var(--button-text-color);
      }
      .themed-button-secondary:hover {
        background-color: var(--link-hover-bg);
      }
      .themed-ring:focus {
        --tw-ring-color: var(--primary-ring-color) !important;
      }
      .themed-text-radio {
        color: var(--button-text-color);
      }
      .themed-peer-checked {
        --tw-bg-opacity: 1;
        background-color: var(--button-bg-color);
      }
      .themed-text {
        color: var(--total-text-color);
      }
      .themed-link-hover:hover {
        background-color: var(--link-hover-bg);
      }
      .themed-dropdown-text {
        color: var(--primary-text-color);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .themed-dropdown-text:hover {
        color: var(--primary-color-hover);
      }
      .peer:checked ~ .toggle-bg {
        background-color: var(--button-bg-color);
      }

      .remark-preset-btn.themed-button-primary {
        background-color: var(--primary-bg-light);
        color: var(--primary-text-color);
      }

      /* 弹窗和打印容器 */
      #modal {
        display: flex;
        flex-direction: column;
        max-height: 90vh;
        margin: 0 10px;
        position: relative;
      }

      #modal-content {
        flex: 1;
        overflow-y: auto;
        padding-right: 0.5rem;
      }
      #modal-close-btn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        color: #9ca3af;
        transition: color 0.2s ease-in-out;
      }
      #modal-close-btn:hover,
      #modal-close-btn:focus {
        color: #4b5563;
      }
      #modal-close-btn:focus-visible {
        outline: 2px solid var(--primary-ring-color);
        outline-offset: 2px;
      }
      body.printing #app-container {
        display: none;
      }
      #modal.modal-large {
        max-width: 1200px;
        width: 95vw;
      }
      td.gridjs-td,
      th.gridjs-th {
        padding: 6px;
      }
      #print-view {
        visibility: hidden;
      }
      /* 缩放样式 */
      .amount-chinese.scale,
      .name.scale {
        font-size: 14pt;
        letter-spacing: -2px;
        padding: 5px 0;
      }
      .amount-numeric.scale {
        letter-spacing: 0.5px;
        writing-mode: vertical-rl;
      }
      /* 响应式 */
      @media (max-width: 700px) {
        .amount-numeric,
        .mark {
          position: relative;
          writing-mode: vertical-rl;
        }
        .gridjs-wrapper {
          overflow-x: auto;
          height: 30vh !important;
        }
      }

      /* 打印样式 */
      @media print {
        :root {
          /* 打印物理尺寸设置 */
          --print-page-width: 210mm;
          --print-page-height: 297mm;
          --print-content-height: 188mm;
          --print-padding-top: 9mm;
          --print-padding-side: 9.5mm;
          --print-footer-bottom: 12px;
          --print-theme-color: var(--custom-print-theme-color, #ec403c);
          --print-base-color: var(--custom-print-base-color, #1f2937);
          --print-base-font: var(--custom-print-base-font, "KaiTi", "楷体", serif);
        }

        /* 页面重置 */
        @page {
          size: var(--print-page-height) var(--print-page-width);
          margin: 0;
        }

        /* 隐藏屏幕元素，显示打印视图 */
        body * {
          visibility: hidden;
        }
        #print-view,
        #print-view * {
          visibility: visible;
        }

        #print-view {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
        }

        /* 容器与背景 */

        /* 外框：统一使用主题色 */
        .gift-book-frame {
          background-color: transparent;
          border-color: var(--print-theme-color) !important;
        }

        .print-page {
          page-break-after: always;
          width: 100%;
          height: 100%;
          padding: var(--print-padding-top) var(--print-padding-side) 0;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          background: var(--custom-bg-image, url("./static/bg.jpg")) center/contain no-repeat, var(--primary-bg-light);
          overflow: hidden;
          position: relative;
          font-family: var(--print-base-font);
          color: var(--print-base-color);
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        /* 封面页 */
        .print-cover-page {
          padding: 0;
          background: none;
          justify-content: center;
          align-items: center;
        }

        .print-cover {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          align-items: center;
          text-align: center;
          width: 100%;
          height: 100%;
          background: var(--custom-cover-image, url("./static/cover1.jpg")) center/contain no-repeat, var(--primary-bg-light);
          /* 封面独立变量 */
          color: var(--cover-text-color);
          font-family: var(--cover-text-font-family);
          padding-bottom: 20mm;
          box-sizing: border-box;
          position: relative;
        }

        .print-cover p {
          font-size: var(--cover-text-font-size);
          letter-spacing: 4px;
        }

        /* 礼簿表格核心样式 */

        .book-cell {
          font-size: 18pt !important;
          border-color: var(--print-theme-color) !important; /* 边框跟随主题色 */
          font-family: var(--print-base-font) !important; /* 字体跟随基础设置 */
          color: var(--print-base-color); /* 颜色跟随基础设置 */
        }

        .type-cell {
          color: var(--custom-type-color, var(--type-color)) !important;
          font-family: var(--custom-type-font, var(--type-font-family)) !important;
          font-size: var(--custom-type-size, 18pt) !important;
          font-weight: bold;
        }

        .name-cell .name {
          color: var(--custom-name-color, var(--name-color)) !important;
          font-family: var(--custom-name-font, var(--name-font-family)) !important;
          font-size: var(--custom-name-size, 18pt) !important;
          padding: 0;
        }
        .name-cell:hover {
          background-color: transparent;
        }

        .amount-chinese {
          color: var(--custom-amount-chinese-color, var(--amount-chinese-color)) !important;
          font-family: var(--custom-amount-chinese-font, var(--amount-chinese-font-family)) !important;
          font-size: var(--custom-amount-chinese-size, 18pt) !important;
        }

        .amount-numeric {
          display: block;
          color: var(--print-base-color, #333) !important;
        }

        .print-book-content {
          border-top-color: var(--print-theme-color) !important;
          height: var(--print-content-height) !important;
          flex: none !important;
          overflow: hidden !important;
        }

        /* 页头与页脚 */

        .print-header {
          text-align: center;
          margin: 35px 0 0;
          color: var(--print-theme-color);
          font-family: var(--print-base-font);
          font-weight: bold;
          font-size: 38px;
        }

        .print-footer {
          flex: 1;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          font-size: 17px;
          padding: 0 0 var(--print-footer-bottom);
          color: var(--print-base-color);
          font-family: var(--print-base-font);
          margin-top: auto;
        }

        .print-footer p {
          margin: 3px 0;
          flex: 1;
        }
        .print-footer-totals {
          flex: 1;
          text-align: right;
        }
        .print-footer .total-amount-print {
          font-weight: bold;
        }
        .print-footer-totals .total-amount-print:not(:last-child) {
          margin-right: 25px;
        }
        .print-page-number {
          text-align: center;
        }

        /* 附录表格样式 */

        .print-appendix-table {
          width: 90%;
          margin: 20px auto 0 auto;
          text-align: center;
          box-sizing: border-box;
          line-height: 4.5em;
        }

        .print-appendix-table th,
        .print-appendix-table td {
          border: 2px solid var(--print-theme-color);
          padding: 8px;
          word-break: break-word;
          font-family: var(--print-base-font);
          font-weight: bold;
          letter-spacing: 2px;
        }

        #print-view .print-appendix-table th {
          color: var(--print-theme-color);
          text-align: center !important;
        }

        /* 附录内容：基础字色 */
        #print-view .print-appendix-table td {
          color: var(--print-base-color);
        }

        .print-appendix-table th:nth-child(3) {
          width: 60%;
        }

        /* 兼容性与杂项 */
        .theme-solemn #print-view {
          filter: grayscale(100%);
        }
        .mark {
          display: none;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen theme-festive">
    <div id="app-container" class="w-full max-w-7xl mx-auto p-4">
      <!-- 设置界面 -->
      <div id="setup-screen" class="bg-white p-8 rounded-lg shadow-xl max-w-2xl mx-auto hidden">
        <h1 class="text-3xl font-bold text-center themed-header mb-6">电子礼簿系统</h1>
        <!-- 账号登录/注册区 -->
        <div id="auth-section" class="mb-8 hidden">
          <div id="auth-login-panel">
            <div class="flex flex-col gap-3">
              <input type="text" id="auth-account" placeholder="账号" autocomplete="username" class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
              <input type="text" id="auth-nickname" placeholder="用户名（可留空，默认同账号）" autocomplete="nickname" class="w-full p-3 border rounded-lg focus:ring-2 themed-ring hidden" />
              <input type="password" id="auth-password" placeholder="密码" autocomplete="current-password" class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
              <input type="password" id="auth-password-confirm" placeholder="确认密码" autocomplete="new-password" class="w-full p-3 border rounded-lg focus:ring-2 themed-ring hidden" />
              <button id="auth-login-btn" class="w-full themed-button-primary p-3 rounded-lg transition duration-300">登录</button>
              <button id="auth-register-btn" class="w-full themed-button-primary p-3 rounded-lg transition duration-300 hidden">注册</button>
            </div>
            <p id="auth-mode-toggle" class="text-xs text-gray-500 mt-3 text-right hidden">没有账号？点击<span id="auth-switch-to-register" class="text-blue-600 cursor-pointer select-none">「注册新账号」</span>创建账号后即可使用。</p>
            <div class="flex items-center gap-3 my-4">
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-xs text-gray-400 select-none">或</span>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <a href="local.html" id="btn-local-experience" class="w-full themed-button-secondary border p-3 rounded-lg transition duration-300 text-center block">先用本地版体验</a>
            <p class="text-xs text-gray-400 mt-2 text-center">数据仅保存在本浏览器，无需注册</p>
          </div>
        </div>
        <div id="select-event-section" class="mb-4 hidden">
          <div class="flex flex-col items-center gap-4">
            <button id="choose-event-btn" type="button" class="w-full max-w-md themed-button-primary p-4 rounded-lg text-lg font-bold transition duration-300"><i class="ri-folder-open-line mr-2"></i>选择已有事项</button>
          </div>
        </div>
        <div id="create-event-section">
          <h2 class="text-xl font-semibold mb-4 border-b pb-2"><span id="or-text">或 </span>创建新事项</h2>
          <form id="create-event-form" class="space-y-4">
            <input type="text" id="event-name" placeholder="事项名称 (例如: 张三李四新婚之喜)" required class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">开始时间</label>
                <div class="flex gap-2">
                  <input type="date" id="start-date" required class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
                  <input type="time" id="start-time" required class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">结束时间</label>
                <div class="flex gap-2">
                  <input type="date" id="end-date" required class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
                  <input type="time" id="end-time" required class="w-full p-3 border rounded-lg focus:ring-2 themed-ring" />
                </div>
              </div>
            </div>

            <details class="group">
              <summary class="cursor-pointer text-sm font-medium text-gray-600 group-hover:text-gray-900 list-none">
                <div class="flex items-center">
                  <span>更多设置</span>
                  <i class="ri-arrow-down-s-line text-lg ml-1 transition-transform transform group-open:rotate-180"></i>
                </div>
              </summary>
              <div class="mt-4 p-4 bg-gray-50 rounded-lg border">
                <div>
                  <label for="event-theme" class="block text-sm font-medium text-gray-700">界面风格</label>
                  <select id="event-theme" class="mt-1 w-full p-3 border rounded-lg focus:ring-2 themed-ring">
                    <option value="theme-festive" selected>喜庆红 (喜事)</option>
                    <option value="theme-solemn">肃穆灰 (白事)</option>
                  </select>
                  <p class="text-xs text-gray-500 mt-2">为不同性质的事项选择合适的界面配色风格。</p>
                </div>
                <div class="mt-4">
                  <label for="event-voice" class="block text-sm font-medium text-gray-700">语音播报音色</label>
                  <div class="flex items-center gap-2 mt-1">
                    <select id="event-voice" class="text-sm flex-grow w-full p-3 border rounded-lg focus:ring-2 themed-ring">
                      <option value="">默认音色</option>
                    </select>
                    <button type="button" id="preview-create-voice-btn" class="themed-button-secondary border p-3 rounded-lg whitespace-nowrap text-xl"><i class="ri-volume-up-line"></i> 预览</button>

    <script type="module">
      /** 应用配置常量 */
      const CONFIG = {
        /** 每页显示的礼金记录数量（影响列表、打印每页容量与分页计算） */
        ITEMS_PER_PAGE: 12,

        /** 封面图最大文件大小（2MB），超出拒绝上传 */
        MAX_COVER_SIZE: 2 * 1024 * 1024,

        /** 打印分批阈值（1008 条 = 84 页），超出启用分批打印，防止渲染卡死；同时用于 GridJS 分页判断 */
        PRINT_SPLIT_THRESHOLD: 1008,
        APP_NAME: "电子礼簿系统",
        /**
         * 后端 API 地址
         * 读取 static/config.js 中的 API_BASE_URL（部署时手动配置）：
         * - 留空 ""：同源部署，请求发往当前域名
         * - 完整地址：前后端分离部署（独立端口/子域名/CDN）
         */
        API_BASE_URL: ((window.__APP_CONFIG__ && window.__APP_CONFIG__.API_BASE_URL) || "").replace(/\/+$/, ""),
        /**
         * 宾客等级系统配置
         * 使用数组存储等级名称，索引即为等级权重（用于排序）
         * 索引越大，等级越高，在打印/导出时排名越靠前
         * 索引范围：0-100（共 101 级：普宾 + 排序 100~1）
         */
        GUEST_LEVELS: ["普宾", ...Array.from({ length: 100 }, (_, index) => `排序${100 - index}`)],
        PASSWORD_CACHE_DURATION: 5,
      };

      const DEFAULT_PRINT_OPTIONS = Object.freeze({
        printCover: true,
        printEndPage: true,
        printAppendix: true,
        printSummary: true,
        printAbolished: true, // 预留选项：打印/PDF 导出固定过滤作废记录，此开关暂未启用
        showCoverTitle: true,
        pdfEngine: "browser",
      });

      /**
       * 工具类 - 提供通用工具方法
       */
      class Utils {
        /**
         * 格式化金额为人民币格式
         * @param {number} amount - 金额数值
         * @returns {string} 格式化后的字符串，如 "￥1,234.56"
         */
        static formatCurrency(amount) {
          return new Intl.NumberFormat("zh-CN", {
            style: "currency",
            currency: "CNY",
          }).format(amount || 0);
        }

        /**
         * 将数字金额转换为中文大写金额
         * @param {number|string} n - 要转换的金额
         * @returns {string} 中文大写金额字符串
         * @example
         */
        static amountToChinese(n) {
          if (typeof n !== "number" && typeof n !== "string") return "";
          n = parseFloat(n);
          if (isNaN(n) || n === null) return "";
          if (n === 0) return "零元整";

          let unit = "京亿万仟佰拾兆万仟佰拾亿仟佰拾万仟佰拾元角分";
          let str = "";
          let s = n.toString();

          if (s.indexOf(".") > -1) s = (n * 100).toFixed(0);
          else s += "00";

          if (s.length > unit.length) return "金额过大";
          unit = unit.substr(unit.length - s.length);

          for (let i = 0; i < s.length; i++) {
            str += "零壹贰叁肆伍陆柒捌玖".charAt(s.charAt(i)) + unit.charAt(i);
          }

          return str
            .replace(/零(仟|佰|拾|角)/g, "零")
            .replace(/(零)+/g, "零")
            .replace(/零(兆|万|亿|元)/g, "$1")
            .replace(/(兆|亿)万/g, "$1")
            .replace(/(京|兆)亿/g, "$1")
            .replace(/(京)兆/g, "$1")
            .replace(/(亿)万/g, "$1")
            .replace(/(京|兆|亿|仟|佰|拾)(万?)(.)/g, "$1$2$3")
            .replace(/零元/g, "元")
            .replace(/零分/g, "")
            .replace(/零角/g, "零")
            .replace(/元$/g, "元整")
            .replace(/角$/g, "角整");
        }

        /**
         * 获取当前日期时间的格式化字符串
         * @returns {{date: string, time: string}} 包含 date 和 time 的对象
         * @example
         *   Utils.getCurrentDateTime()
         *   // => { date: "2025-10-12", time: "14:30" }
         * 用途：为创建事项表单设置默认时间
         */
        static getCurrentDateTime() {
          const now = new Date();
          const pad = (num) => num.toString().padStart(2, "0");
          const date = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
          const time = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
          return { date, time };
        }

        static getEventDateInfo(dateInput) {
          const date = new Date(dateInput);
          if (Number.isNaN(date.getTime())) {
            return { date, formattedDisplay: "", localeDate: "" };
          }
          const formattedDisplay = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
          return {
            date,
            formattedDisplay,
            localeDate: date.toLocaleDateString("zh-CN"),
          };
        }

        /**
         * 生成用于文件名的时间戳
         * @param {Date} date
         * @returns {string} yyyy-mm-dd hh:mm:ss
         */
        static formatTimestampForFilename(date = new Date()) {
          const pad = (num) => num.toString().padStart(2, "0");
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        /**
         * HTML 转义工具：防止用户输入（姓名、备注、搜索词等）注入 HTML
         * 所有把用户可控文本拼进 innerHTML 的位置都应使用本方法
         * @param {*} value - 要转义的文本
         * @returns {string} 转义后的安全字符串
         */
        static escapeHtml(value) {
          return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
        }

        /** @returns {boolean} */
        static isMobile() {
          return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }
      }

      /**
       * 加密管理器 - 处理所有加密相关操作
       * 使用 CryptoJS 库实现 AES 加密和 SHA-256 哈希
       * 用途：保护礼金数据的隐私性和完整性
       *
       * 信封加密模型（借鉴 Bitwarden）：
       * - KEK（密钥加密密钥）：由账号密码经 PBKDF2（SHA-256，10 万次迭代）派生，仅用于包裹/解开 DEK，不直接加密数据
       * - DEK（数据加密密钥）：注册时随机生成的 256 位密钥，所有礼金数据仅用 DEK 加解密；
       *   服务端只存 DEK 密文（Encrypt(DEK, KEK)），客户端登录后解出明文 DEK 缓存于内存
       * - 改密时只需用新密码派生的 KEK 重新包裹 DEK（O(1)），无需遍历任何礼金记录
       * - 旧版方法 encrypt/decrypt（字符串密钥）仅保留用于 BIN 备份密码与本地会话/缓存包裹，与原版格式双向兼容
       */
      class CryptoService {
        /** PBKDF2 迭代次数（KEK 派生强度；轻量项目取 10 万次，兼顾性能与安全） */
        static PBKDF2_ITERATIONS = 100000;

        /**
         * 加密数据 - 使用 AES 对称加密算法
         * @param {Object} data - 要加密的数据对象（会先转为JSON字符串）
         * @param {string} key - 加密密钥（字符串密钥：BIN 备份密码 / 会话包裹等）
         * @returns {string} 加密后的密文字符串
         */
        static encrypt(data, key) {
          return CryptoJS.AES.encrypt(JSON.stringify(data), key).toString();
        }

        /**
         * 解密数据 - 使用 AES 对称解密算法
         * @param {string} ciphertext - 密文字符串
         * @param {string} key - 解密密钥（必须与加密时的密钥一致）
         * @returns {Object|null} 解密后的数据对象，失败时返回 null
         */
        static decrypt(ciphertext, key) {
          try {
            const bytes = CryptoJS.AES.decrypt(ciphertext, key);
            return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
          } catch (e) {
            console.error("解密失败:", e);
            return null; // 密钥错误或数据损坏时返回null
          }
        }

        /**
         * 哈希密码 - 使用 SHA-256 单向哈希算法
         * @param {string} password - 原始密码
         * @returns {string} 哈希值（用于密码验证，不可逆）
         * 注意：哈希值存储在数据库中，用于验证密码而不存储明文
         */
        static hash(password) {
          return CryptoJS.SHA256(password).toString();
        }

        /** 生成 n 字节随机数，返回 base64 字符串（用于 DEK / PBKDF2 盐值） */
        static randomBytesB64(n) {
          if (window.crypto && typeof window.crypto.getRandomValues === "function") {
            const bytes = new Uint8Array(n);
            window.crypto.getRandomValues(bytes); // 密码学安全随机源
            const words = [];
            for (let i = 0; i < n; i += 4) {
              words.push(
                (bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | (bytes[i + 3] << 0)
              );
            }
            return CryptoJS.enc.Base64.stringify(CryptoJS.lib.WordArray.create(words, n));
          }
          return CryptoJS.enc.Base64.stringify(CryptoJS.lib.WordArray.random(n));
        }

        /** 生成数据加密密钥（DEK）：32 字节随机数 → base64（256 位 AES 密钥） */
        static generateDek() {
          return this.randomBytesB64(32);
        }

        /** 生成 PBKDF2 盐值：16 字节随机数 → base64 */
        static generateSalt() {
          return this.randomBytesB64(16);
        }

        /**
         * 使用 PBKDF2（SHA-256）从账号密码派生 256 位密钥加密密钥（KEK）
         * @param {string} password - 账号明文密码
         * @param {string} saltB64 - PBKDF2 盐值（base64）
         * @param {number} iterations - 迭代次数（缺省用 CryptoService.PBKDF2_ITERATIONS）
         * @returns {Object} CryptoJS WordArray（32 字节）
         */
        static async deriveKek(password, saltB64, iterations) {
          const iter = iterations || CryptoService.PBKDF2_ITERATIONS;
          // 优先使用浏览器原生 WebCrypto（PBKDF2 性能比 CryptoJS 纯 JS 快 10~50 倍，老旧设备/移动端感知明显）
          if (window.crypto && window.crypto.subtle && typeof TextEncoder !== "undefined") {
            try {
              const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveBits"]
              );
              const saltBytes = Uint8Array.from(atob(saltB64), (c) => c.charCodeAt(0));
              const bits = await window.crypto.subtle.deriveBits(
                { name: "PBKDF2", hash: "SHA-256", salt: saltBytes, iterations: iter },
                keyMaterial,
                256
              );
              // 保持返回 CryptoJS WordArray（32 字节），与 wrapDek/unwrapDek 完全兼容
              return CryptoJS.lib.WordArray.create(new Uint8Array(bits));
            } catch (e) {
              console.warn("WebCrypto PBKDF2 不可用，回退 CryptoJS 实现:", e);
            }
          }
          // 回退：CryptoJS 纯 JS 实现（PBKDF2-HMAC-SHA256，与 WebCrypto 输出一致）
          const salt = CryptoJS.enc.Base64.parse(saltB64);
          return CryptoJS.PBKDF2(password, salt, {
            keySize: 256 / 32,
            iterations: iter,
            hasher: CryptoJS.algo.SHA256,
          });
        }

        /**
         * 信封加密（v2 格式）：随机 IV + AES-256-CBC + PKCS7
         * @param {string} plainText - 明文字符串
         * @param {Object} keyWords - CryptoJS WordArray 密钥（如 KEK / DEK）
         * @returns {string} "v2:<ivBase64>:<cipherBase64>"
         */
        static envelopeEncrypt(plainText, keyWords) {
          const iv = CryptoJS.lib.WordArray.random(16);
          const encrypted = CryptoJS.AES.encrypt(plainText, keyWords, {
            iv,
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7,
          });
          return `v2:${CryptoJS.enc.Base64.stringify(iv)}:${encrypted.toString()}`;
        }

        /**
         * 信封解密（v2 格式）
         * @param {string} payload - "v2:<ivBase64>:<cipherBase64>"
         * @param {Object} keyWords - CryptoJS WordArray 密钥
         * @returns {string|null} 明文字符串，失败返回 null
         */
        static envelopeDecrypt(payload, keyWords) {
          try {
            if (typeof payload !== "string") return null;
            const parts = payload.split(":");
            if (parts.length !== 3 || parts[0] !== "v2") return null;
            const iv = CryptoJS.enc.Base64.parse(parts[1]);
            const bytes = CryptoJS.AES.decrypt(parts[2], keyWords, {
              iv,
              mode: CryptoJS.mode.CBC,
              padding: CryptoJS.pad.Pkcs7,
            });
            const text = bytes.toString(CryptoJS.enc.Utf8);
            return text || null;
          } catch (e) {
            console.error("信封解密失败:", e);
            return null;
          }
        }

        /**
         * 用 DEK 加密礼金数据对象（v2 信封格式）
         * @param {Object} data - 礼金数据对象
         * @param {string} dekB64 - DEK（base64，256 位）
         * @returns {string} "v2:<ivBase64>:<cipherBase64>"
         */
        static encryptData(data, dekB64) {
          const key = CryptoJS.enc.Base64.parse(dekB64);
          return this.envelopeEncrypt(JSON.stringify(data), key);
        }

        /**
         * 用 DEK 解密礼金数据
         * @param {string} payload - v2 密文
         * @param {string} dekB64 - DEK（base64）
         * @returns {Object|null} 解密后的数据对象，失败返回 null
         */
        static decryptData(payload, dekB64) {
          const plain = this.envelopeDecrypt(payload, CryptoJS.enc.Base64.parse(dekB64));
          if (plain === null) return null;
          try {
            return JSON.parse(plain);
          } catch (e) {
            console.error("解密数据解析失败:", e);
            return null;
          }
        }

        /**
         * 用 KEK 包裹 DEK（注册 / 改密时使用）
         * @param {string} dekB64 - DEK（base64）
         * @param {Object} kekWords - KEK（WordArray）
         * @returns {string} "v2:<ivBase64>:<cipherBase64>"
         */
        static wrapDek(dekB64, kekWords) {
          // 明文带固定 magic 前缀 "GBD2:"，解开时可强校验密钥正确性
          return this.envelopeEncrypt("GBD2:" + dekB64, kekWords);
        }

        /**
         * 用 KEK 解开 DEK（登录时使用）
         * @param {string} payload - "v2:<ivBase64>:<cipherBase64>"
         * @param {Object} kekWords - KEK（WordArray）
         * @returns {string|null} DEK（base64，32 字节），校验失败返回 null
         */
        static unwrapDek(payload, kekWords) {
          const plain = this.envelopeDecrypt(payload, kekWords);
          if (!plain) return null;
          try {
            const MAGIC = "GBD2:";
            // 新格式：明文以 magic 前缀开头，密码错误时几乎不可能解出该前缀
            if (plain.startsWith(MAGIC)) {
              const dekB64 = plain.slice(MAGIC.length);
              if (CryptoJS.enc.Base64.parse(dekB64).sigBytes !== 32) return null;
              return dekB64;
            }
            // 兼容旧格式（无前缀）：仅校验 DEK 为合法的 32 字节 base64
            if (CryptoJS.enc.Base64.parse(plain).sigBytes !== 32) return null;
            return plain;
          } catch (e) {
            return null;
          }
        }
      }

      /**
       * API 客户端 - 封装对 Node.js 后端的 HTTP 请求
       * 统一处理：JWT 认证头、JSON 序列化、401 未授权、错误解析
       */
      class ApiClient {
        constructor() {
          this.token = null;
          this.onUnauthorized = null; // 401 回调（用于强制退出登录）
        }

        setToken(token) {
          this.token = token || null;
        }

        clearToken() {
          this.token = null;
        }

        /**
         * 发起请求
         * @param {string} method - HTTP 方法 (GET/POST/PUT/DELETE)
         * @param {string} path - 接口路径（含 /api 前缀）
         * @param {object} body - 请求体（可选）
         * @returns {Promise<any>} 解析后的 JSON 响应
         */
        async request(method, path, body) {
          const headers = { "Content-Type": "application/json" };
          if (this.token) headers["Authorization"] = `Bearer ${this.token}`;

          let res;
          try {
            res = await fetch(`${CONFIG.API_BASE_URL}${path}`, {
              method,
              headers,
              body: body !== undefined ? JSON.stringify(body) : undefined,
            });
          } catch (error) {
            throw new Error("无法连接到服务器，请确认后端服务已启动。");
          }

          if (res.status === 401 && !path.endsWith("/login")) {
            if (this.onUnauthorized) this.onUnauthorized();
            throw new Error("登录已过期，请重新登录。");
          }

          let data = null;
          try {
            data = await res.json();
          } catch (error) {
            data = null;
          }

          if (!res.ok) {
            throw new Error(data?.error || `请求失败 (${res.status})`);
          }
          return data;
        }
      }

        /**
         * 显示模态对话框 - 统一的弹窗显示接口
         * @param {string} title - 对话框标题（支持HTML）
         * @param {string} content - 对话框内容（支持HTML）
         * @param {Array<Object>} actions - 按钮数组，每个元素包含：
         *   - text: 按钮文字
         *   - class: CSS类名
         *   - handler: 点击回调函数
         *   - keepOpen: 是否保持弹窗打开（默认关闭）
         *   - id: 可选，按钮ID
         *   - role: 可选，按钮角色（primary/secondary）。默认最后一个为 primary
         */
        showModal(title, content, actions = []) {
          // 设置对话框内容
          this.elements.modalTitle.innerHTML = title;
          this.elements.modalContent.innerHTML = content;
          // 确保按钮区域可见（防止被先前流程隐藏）
          this.elements.modalActions.classList.remove("hidden");
          this.elements.modalActions.innerHTML = ""; // 清空旧按钮防止重复

          // 动态创建按钮
          let primaryButton = null;
          actions.forEach((action, idx) => {
            const button = document.createElement("button");
            button.innerHTML = action.text;
            button.className = `${action.class} themed-ring focus:outline-none`;
            if (action.id) button.id = action.id;
            const role = action.role || (idx === actions.length - 1 ? "primary" : "secondary");
            button.dataset.role = role;
            button.onclick = () => {
              action.handler?.(); // 执行回调（如果存在）
              if (!action.keepOpen) this.closeModal(); // 除非指定保持打开，否则自动关闭
            };
            if (role === "primary") primaryButton = button;
            this.elements.modalActions.appendChild(button);
          });

          // 显示对话框并锁定背景滚动
          this.elements.modalContainer.classList.remove("hidden");
          document.body.style.overflow = "hidden";

          // 将焦点默认设置到主操作按钮，避免回车触发取消
          if (primaryButton) setTimeout(() => primaryButton.focus(), 10);
        }

        closeModal() {
          this.elements.modalContainer.classList.add("hidden");
          this.elements.modal.classList.remove("modal-large");
          document.body.style.overflow = "auto";
        }

        showNotification(message, type = "info") {
          const notification = document.createElement("div");
          notification.className = "fixed top-5 left-1/2 -translate-x-1/2 flex items-center px-4 py-3 rounded-lg shadow-xl text-white z-[100] transition-all duration-500 ease-in-out opacity-0 -translate-y-full";

          const styles = {
            info: { icon: "ri-information-line", bg: "bg-blue-600" },
            success: { icon: "ri-check-line", bg: "bg-green-600" },
            error: { icon: "ri-error-warning-line", bg: "themed-button-primary" },
          };

          const style = styles[type] || styles.info;
          notification.classList.add(style.bg);
          notification.innerHTML = `<i class="${style.icon} text-xl mr-1"></i><span>${Utils.escapeHtml(message)}</span>`;

          document.body.appendChild(notification);
          setTimeout(() => notification.classList.remove("opacity-0", "-translate-y-full"), 10);

          setTimeout(() => {
            notification.classList.add("opacity-0", "-translate-y-full");
            notification.addEventListener("transitionend", () => notification.remove());
          }, 3000);
        }

        applyTheme(theme) {
          document.body.className = `bg-gray-100 flex items-center justify-center min-h-screen ${theme || "theme-festive"}`;
        }
      }

      class SessionManager {
        /**
         * @param {string} [storageKey="activeEventSession"] - sessionStorage key
         */
        constructor(storageKey = "activeEventSession") {
          this.storageKey = storageKey;
          this.auth = null; // { token, user, accountPasswordHash }
        }

        /**
         * 记录当前登录账号信息，保存会话时自动写入
         * @param {object|null} auth - { token, user, accountPasswordHash }，传 null 清除
         */
        setAuth(auth) {
          this.auth = auth || null;
        }

        /** 保存会话：登录信息 + DEK 密文（event 可为空，空时仅保存登录状态）
         * 用账号密码哈希加密 DEK，刷新后可还原加解密密钥
         */
        save(event, dataKey) {
          const payload = {};
          if (event) payload.event = event;
          if (this.auth) {
            payload.token = this.auth.token;
            payload.user = this.auth.user;
            payload.accountPasswordHash = this.auth.accountPasswordHash;
          }
          if (dataKey && payload.accountPasswordHash) {
            payload.encryptedDek = CryptoJS.AES.encrypt(dataKey, payload.accountPasswordHash).toString();
          }
          sessionStorage.setItem(this.storageKey, JSON.stringify(payload));
        }

        load() {
          const stored = sessionStorage.getItem(this.storageKey);
          if (!stored) return null;
          try {
            return JSON.parse(stored);
          } catch (error) {
            console.error("会话读取失败", error);
            sessionStorage.removeItem(this.storageKey);
            return null;
          }
        }

        /**
         * 仅清除当前事项会话，保留登录信息（token / 用户 / DEK 密文）
         * 除退出登录外，任何操作（返回首页、删除事项、切换事项）都不应退出登录态
         */
        clear() {
          const payload = this.load();
          if (!payload) return;
          const kept = {};
          if (payload.token) kept.token = payload.token;
          if (payload.user) kept.user = payload.user;
          if (payload.accountPasswordHash) kept.accountPasswordHash = payload.accountPasswordHash;
          if (payload.encryptedDek) kept.encryptedDek = payload.encryptedDek;
          if (Object.keys(kept).length) {
            sessionStorage.setItem(this.storageKey, JSON.stringify(kept));
          } else {
            sessionStorage.removeItem(this.storageKey);
          }
        }

        /** 清空整个会话（仅退出登录时使用） */
        destroy() {
          sessionStorage.removeItem(this.storageKey);
        }
      }

      class PasswordCache {
        constructor(durationMinutes) {
          this.durationMinutes = durationMinutes;
          this.storagePrefix = "adminPwdCache_";
        }

        _key(eventId) {
          return `${this.storagePrefix}${eventId}`;
        }

        store(eventId, password, passwordHash) {
          try {
            const encrypted = CryptoJS.AES.encrypt(password, passwordHash).toString();
            const expireTime = Date.now() + this.durationMinutes * 60 * 1000;
            localStorage.setItem(this._key(eventId), JSON.stringify({ encrypted, expireTime }));
          } catch (error) {
            console.error("密码缓存失败:", error);
          }
        }

        retrieve(eventId, passwordHash) {
          try {
            const cached = localStorage.getItem(this._key(eventId));
            if (!cached) return null;
            const { encrypted, expireTime } = JSON.parse(cached);
            if (Date.now() > expireTime) {
              localStorage.removeItem(this._key(eventId));
              return null;
            }
            const bytes = CryptoJS.AES.decrypt(encrypted, passwordHash);
            return bytes.toString(CryptoJS.enc.Utf8);
          } catch (error) {
            console.error("密码缓存读取失败:", error);
            return null;
          }
        }

        clear(eventId) {
          localStorage.removeItem(this._key(eventId));
        }

        /** 清除该账号在本机缓存的所有密码条目（令牌失效强制登出时调用） */
        clearAll() {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const key = localStorage.key(i);
            if (key && key.startsWith(this.storagePrefix)) {
              localStorage.removeItem(key);
            }
          }
        }
      }

      /**
       * 统计礼金记录姓名纠错的次数
       * - 兼容旧历史记录中未写入 changedFields 的情况
       * - 仅统计类型为 correction 的历史节点
       * @param {Array} history - 礼金历史记录
       * @returns {number} 已经执行的姓名纠错次数
       */
      function countNameCorrections(history) {
        if (!Array.isArray(history)) return 0;
        return history.reduce((total, entry) => {
          if (!entry || entry.type !== "correction") return total;
          if (Array.isArray(entry.changedFields) && entry.changedFields.includes("name")) return total + 1;
          if (typeof entry.changeLog === "string" && entry.changeLog.includes("纠错姓名")) return total + 1;
          return total;
        }, 0);
      }

      /**
       * 统计礼金记录金额被修改的次数
       * @param {Array} history - 礼金历史记录
       * @returns {number} 已经执行的金额调整次数
       */
      function countAmountCorrections(history) {
        if (!Array.isArray(history)) return 0;
        return history.reduce((total, entry) => {
          if (!entry || entry.type !== "correction") return total;
          if (Array.isArray(entry.changedFields) && entry.changedFields.includes("amount")) return total + 1;
          if (typeof entry.changeLog === "string" && (/金额/.test(entry.changeLog) || entry.changeLog.toLowerCase().includes("amount"))) return total + 1;
          return total;
        }, 0);
      }
